            operation_args+=(--previous-target-sha "$PREVIOUS_TARGET_SHA" --attempt-recovery-evidence "$ATTEMPT_RECOVERY_EVIDENCE")
          else
            test -z "$ATTEMPT_RECOVERY_EVIDENCE"
          fi
          if [ "$command" = recover-second-attempt ]; then
            [[ "$SECOND_ATTEMPT_RECOVERY_EVIDENCE" =~ ^[A-Za-z0-9_-]+$ ]]
            test "${#SECOND_ATTEMPT_RECOVERY_EVIDENCE}" -le 16384
            operation_args+=(--previous-target-sha "$PREVIOUS_TARGET_SHA" --second-attempt-recovery-evidence "$SECOND_ATTEMPT_RECOVERY_EVIDENCE")
