          [[ "$APP_NAME" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$APP_PORT" =~ ^[0-9]{1,5}$ ]] && test "$APP_PORT" -ge 1 && test "$APP_PORT" -le 65535
          case "$ACTION" in
            diagnose-runtime) command=diagnose-runtime; expected_state=runtime-diagnosed ;;
            diagnose-pm2-peer) command=diagnose-pm2-peer; expected_state=pm2-peer-diagnosed ;;
            plan) command=plan; expected_state=planned ;;
            prepare) command=prepare; expected_state=held ;;
            recover-held) command=recover-held; expected_state=held ;;
            continue-held) command=continue-held; expected_state=held ;;
            recover-build) command=recover-build; expected_state=held ;;
            recover-attempt) command=recover-attempt; expected_state=held ;;
            recover-second-attempt) command=recover-second-attempt; expected_state=held ;;
            recover-budget) command=recover-budget; expected_state=held ;;
            renew-window) command=renew-window; expected_state=held ;;
            recover-prelaunch) command=recover-prelaunch; expected_state=held ;;
            renew-lease) command=renew-lease; expected_state=held ;;
            recover-fence) command=recover-fence; expected_state=held ;;
            recover-preflight) command=recover-preflight; expected_state=held ;;
