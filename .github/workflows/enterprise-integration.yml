name: Enterprise PostgreSQL integration

on:
  pull_request:
    paths:
      - "scripts/supabase-init.sql"
      - "scripts/supabase-migrations/**"
      - "scripts/enterprise-integration/**"
      - ".github/workflows/enterprise-integration.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/supabase-init.sql"
      - "scripts/supabase-migrations/**"
      - "scripts/enterprise-integration/**"
      - ".github/workflows/enterprise-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: faolla_enterprise_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d faolla_enterprise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/faolla_enterprise_test?sslmode=disable
      ENTERPRISE_INTEGRATION_ALLOW_DISPOSABLE_DATABASE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run enterprise database acceptance
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          umask 077
          node --test scripts/enterprise-integration-workflow-contract.test.mjs
          docker cp "${GITHUB_WORKSPACE}/." "${POSTGRES_CONTAINER_ID}:/workspace"
          psql_wrapper_dir="$(mktemp -d)"
          trap 'rm -rf -- "$psql_wrapper_dir"' EXIT
          cat > "$psql_wrapper_dir/psql" <<'PSQL_WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${POSTGRES_CONTAINER_ID:?POSTGRES_CONTAINER_ID is required}"
          : "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}"
          translated=()
          for argument in "$@"; do
            if [[ "$argument" == "$GITHUB_WORKSPACE"/* ]]; then
              argument="/workspace/${argument#"$GITHUB_WORKSPACE"/}"
            elif [[ "$argument" == "$GITHUB_WORKSPACE" ]]; then
              argument="/workspace"
            fi
            translated+=("$argument")
          done
          exec docker exec \
            -i \
            --workdir /workspace \
            --env "PGOPTIONS=${PGOPTIONS:-}" \
            "$POSTGRES_CONTAINER_ID" \
            psql "${translated[@]}"
          PSQL_WRAPPER
          chmod 700 "$psql_wrapper_dir/psql"
          PATH="$psql_wrapper_dir:$PATH" \
            bash scripts/enterprise-integration/run.sh
