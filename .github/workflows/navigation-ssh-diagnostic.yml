name: Navigation SSH Fixture Diagnostic
on:
  push:
    branches: [diagnostic/navigation-ssh-timeout-20261115]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Observe unchanged isolated transport contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -m 700 "$RUNNER_TEMP/navigation-ssh-diagnostic"
          export NAV_DIAG_ROOT="$RUNNER_TEMP/navigation-ssh-diagnostic"
          export NAV_DIAG_OBSERVER="$GITHUB_WORKSPACE/scripts/navigation-ssh-diagnostic.py"
          export BASH="$NAV_DIAG_ROOT/bash-observer"
          printf '%s\n' '#!/bin/bash' \
            'if [ "$1" = "-s" ]; then' \
            '  python3 -u "$NAV_DIAG_OBSERVER" "$$" "$NAV_DIAG_ROOT" </dev/null >/dev/null 2>&1 &' \
            'fi' \
            'exec /bin/bash "$@"' > "$BASH"
          chmod 700 "$BASH"
          failed=0
          for group in 1 2 3 4; do
            (
              for repetition in 1 2 3 4 5 6 7 8; do
                if ! node --test --test-name-pattern='deploy keeps every config value in an integrity-checked SSH stdin envelope' scripts/deploy-production-contract.test.mjs > "$NAV_DIAG_ROOT/test-$group-$repetition.log" 2>&1; then
                  printf '%s\n' "failed-group-$group-repetition-$repetition" > "$NAV_DIAG_ROOT/failure-$group"
                  exit 1
                fi
              done
            ) &
            groups[$group]=$!
          done
          for group in 1 2 3 4; do
            wait "${groups[$group]}" || failed=1
          done
          printf 'diagnostic_failure=%s\n' "$failed"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-ssh-fixed-field-diagnostic
          path: ${{ runner.temp }}/navigation-ssh-diagnostic/*.log
          retention-days: 30
