name: Release Toolchain Safety

on:
  pull_request:
    paths:
      - 'scripts/release-toolchain*'
      - 'scripts/test-support/release-toolchain-*'
      - 'scripts/booking-handoff-execution*'
      - 'scripts/booking-handoff-policy.mjs'
      - 'scripts/booking-handoff-retention*'
      - 'scripts/booking-handoff-active-retention*'
      - 'scripts/test-support/booking-handoff-active-*'
      - '.github/workflows/release-toolchain.yml'
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  toolchain:
    name: Packaged Tools And Real Ingress Boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20.20.1
          cache: npm
      - name: Install Development Test Dependencies
        run: npm ci
      - name: Unit And Existing Handoff Regression Tests
        run: node --test scripts/release-toolchain-*.test.mjs scripts/booking-ci-continuation-tool.test.mjs scripts/booking-ready-*.test.mjs scripts/booking-handoff-activation.test.mjs scripts/booking-handoff-rule-repair.test.mjs scripts/booking-publication-database.test.mjs scripts/booking-handoff-execution.test.mjs scripts/booking-handoff-host.test.mjs scripts/booking-handoff-native-acceptance.test.mjs scripts/booking-handoff-retention.test.mjs scripts/booking-handoff-active-retention.test.mjs scripts/booking-atomic-worker.test.mjs
      - name: Install Disposable Runner Nginx
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y nginx
      - name: Build Complete Tool Bundle From Exact Commit
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          node scripts/release-toolchain-pack.mjs pack "$GITHUB_WORKSPACE" "$revision" "$RUNNER_TEMP/release-toolchain-bundle"
          node "$RUNNER_TEMP/release-toolchain-bundle/scripts/release-toolchain.mjs" verify-bundle "$RUNNER_TEMP/release-toolchain-bundle"
      - name: Real Owned Old200 New503 Drain And Negative Cases
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/release-toolchain-bundle/scripts/release-toolchain.mjs" rehearse /usr/sbin/nginx 5
      - name: Real Interruption And Owned Cleanup
        shell: bash
        run: node "$RUNNER_TEMP/release-toolchain-bundle/scripts/release-toolchain-interrupt-acceptance.mjs" "$RUNNER_TEMP/release-toolchain-bundle" /usr/sbin/nginx
      - name: Full New-Database Handoff And Recovery Rehearsal
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          source="/var/lib/faolla-online-code/$revision"
          application="/var/lib/faolla-release-toolchain-application-$revision"
          # setup-node is intentionally outside sudo's PATH on hosted runners.
          # Install its already selected Node 20 binary at the native test path.
          sudo install -m 755 "$(command -v node)" /usr/bin/node
          sudo docker pull supabase/postgres@sha256:af083ef64d0408c8f098ee6f5c364a59b26f36fbc0f3a334a62c5c1d57362e9b
          sudo mkdir -p /www/wwwroot /var/lib/faolla-online-code
          sudo git clone --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" /www/wwwroot/merchant-space
          sudo git -C /www/wwwroot/merchant-space worktree add --detach --no-checkout "$source" "$revision"
          printf '/*\n!/public/downloads/\n' | sudo git -C "$source" sparse-checkout set --no-cone --stdin
          sudo git -C "$source" config --worktree core.sparseCheckoutCone false
          sudo git -C "$source" config --worktree index.sparse false
          sudo git -C "$source" read-tree -mu HEAD
          sudo chmod 700 "$source"
          sudo mkdir -m 700 "$application"
          sudo cp -a "$GITHUB_WORKSPACE/package.json" "$GITHUB_WORKSPACE/tsconfig.json" "$GITHUB_WORKSPACE/src" "$GITHUB_WORKSPACE/node_modules" "$application/"
          sudo chown -R root:root "$application"
          sudo /usr/bin/node "$source/scripts/release-toolchain-full-rehearsal.mjs"
          sudo /usr/bin/node "$source/scripts/release-toolchain-full-interrupt.mjs"
      - name: Full Active-Profile Isolated Handoff And Interruption
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          sudo /usr/bin/node "/var/lib/faolla-online-code/$revision/scripts/release-toolchain-full-active-rehearsal.mjs"
          printf '{"kind":"active-normal-cli-exited"}\n'
          # Fresh independent owners expose rare readiness/read/exit races.
          # Stop at the first failure and keep its full diagnostic evidence.
          for repetition in 1 2 3 4 5 6 7 8; do
            printf '{"kind":"active-interruption-cli-starting","repetition":%s}\n' "$repetition"
            sudo /usr/bin/node "/var/lib/faolla-online-code/$revision/scripts/release-toolchain-full-active-rehearsal.mjs" --interrupt
          done
      - name: Real PM2 And Next Production Transition Equivalence
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          npm_cli="$(readlink -f "$(command -v npm)")"
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            FAOLLA_RELEASE_PRODUCTION_EQ=1 FAOLLA_EQ_NPM_CLI="$npm_cli" \
            /usr/bin/node "/var/lib/faolla-online-code/$revision/scripts/release-toolchain-pm2-real-acceptance.mjs"
      - name: Eight Worker Fresh TLS And Pooled HTTP2 Origin Coverage
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          sudo /usr/bin/node "/var/lib/faolla-online-code/$revision/scripts/release-toolchain-origin-gate-native.mjs"
      - name: Recovered Failure Actual Kernel CAS And Trusted Python Acceptance
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            FAOLLA_RELEASE_PRODUCTION_EQ=1 \
            /usr/bin/node "/var/lib/faolla-online-code/$revision/scripts/release-toolchain-origin-recovery-native.mjs"
      - name: Already Active Routing And Real Controller Death Recovery
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          # Independent fresh resources after each successful pass. The FIRST
          # failure stops; no failed attempt is retried, resumed or discarded.
          for repetition in 1 2 3 4 5 6 7 8; do
            sudo /usr/bin/node "/var/lib/faolla-online-code/$revision/scripts/release-toolchain-active-generation-routing-native-entry.mjs"
          done
          sudo /usr/bin/node "/var/lib/faolla-online-code/$revision/scripts/release-toolchain-active-generation-routing-native-entry.mjs" --interrupt
      - name: Interrupted Publication Independent Recovery Kernel And CAS
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            /usr/bin/node "/var/lib/faolla-online-code/$revision/scripts/release-toolchain-interrupted-recovery-native.mjs"
      - name: Active Incident Existing Operation Kernel Lock Acceptance
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            FAOLLA_RELEASE_PRODUCTION_EQ=1 \
            /usr/bin/node "/var/lib/faolla-online-code/$revision/scripts/release-toolchain-active-generation-lock-acceptance.mjs"
      - name: Collect Root-Owned Synthetic Reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          roots=(/var/lib/faolla-booking-full-rehearsal-* /var/lib/faolla-release-toolchain-isolation-* /var/lib/faolla-release-toolchain-interruption-* /var/lib/faolla-active-routing-native-* /var/lib/faolla-active-routing-interruption-* /var/lib/faolla-origin-gate-native-* /var/lib/faolla-origin-recovery-ci-* /var/lib/faolla-interrupted-recovery-native-* /tmp/faolla-cwd-native-*)
          if ((${#roots[@]})); then
            sudo find "${roots[@]}" -type f -name '*.json' -print0 | sudo tar --null -T - -cf "$RUNNER_TEMP/release-toolchain-native-evidence.tar"
            sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/release-toolchain-native-evidence.tar"
          fi
          # Expand only the public /var/lib entry names as runner. Traversal of
          # private 0700 roots happens under sudo, not in a non-root shell glob.
          eq_roots=(/var/lib/faolla-eq-*)
          if ((${#eq_roots[@]})); then
            sudo find "${eq_roots[@]}" -maxdepth 2 -type f -path '/var/lib/faolla-eq-*/reports/*.json' -print0 | sudo tar --null -T - -cf "$RUNNER_TEMP/release-toolchain-equivalence-evidence.tar"
            sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/release-toolchain-equivalence-evidence.tar"
          fi
          lock_roots=(/var/lib/faolla-active-lock-ci-*)
          if ((${#lock_roots[@]})); then
            sudo find "${lock_roots[@]}" -maxdepth 1 -type f -name '*.json' -print0 | sudo tar --null -T - -cf "$RUNNER_TEMP/release-toolchain-active-lock-evidence.tar"
            sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/release-toolchain-active-lock-evidence.tar"
          fi
          pre_control_roots=(/var/lib/faolla-pre-control-ci-*)
          if ((${#pre_control_roots[@]})); then
            sudo find "${pre_control_roots[@]}" -maxdepth 1 -type f -name '*.json' -print0 | sudo tar --null -T - -cf "$RUNNER_TEMP/release-toolchain-pre-control-evidence.tar"
            sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/release-toolchain-pre-control-evidence.tar"
          fi
          python_runtime_roots=(/var/lib/faolla-python-runtime-ci-*)
          if ((${#python_runtime_roots[@]})); then
            sudo find "${python_runtime_roots[@]}" -maxdepth 1 -type f -name '*.json' -print0 | sudo tar --null -T - -cf "$RUNNER_TEMP/release-toolchain-python-runtime-evidence.tar"
            sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/release-toolchain-python-runtime-evidence.tar"
          fi
          preconnect_roots=(/var/lib/faolla-preconnect-ci-*)
          if ((${#preconnect_roots[@]})); then
            sudo find "${preconnect_roots[@]}" -maxdepth 1 -type f -name '*.json' -print0 | sudo tar --null -T - -cf "$RUNNER_TEMP/release-toolchain-preconnect-evidence.tar"
            sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/release-toolchain-preconnect-evidence.tar"
          fi
          pre_intent_roots=(/var/lib/faolla-pre-intent-ci-*)
          if ((${#pre_intent_roots[@]})); then
            sudo find "${pre_intent_roots[@]}" -maxdepth 1 -type f -name '*.json' -print0 | sudo tar --null -T - -cf "$RUNNER_TEMP/release-toolchain-pre-intent-evidence.tar"
            sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/release-toolchain-pre-intent-evidence.tar"
          fi
          vault_roots=(/var/lib/faolla-active-vault-ci-*)
          if ((${#vault_roots[@]})); then
            sudo find "${vault_roots[@]}" -maxdepth 1 -type f -name '*.json' -print0 | sudo tar --null -T - -cf "$RUNNER_TEMP/release-toolchain-active-vault-evidence.tar"
            sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/release-toolchain-active-vault-evidence.tar"
          fi
          metadata_roots=(/var/lib/faolla-active-metadata-ci-*)
          if ((${#metadata_roots[@]})); then
            sudo find "${metadata_roots[@]}" -maxdepth 1 -type f -name '*.json' -print0 | sudo tar --null -T - -cf "$RUNNER_TEMP/release-toolchain-active-metadata-evidence.tar"
            sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/release-toolchain-active-metadata-evidence.tar"
          fi
          reconciliation_roots=(/var/lib/faolla-active-reconciliation-ci-*)
          if ((${#reconciliation_roots[@]})); then
            sudo find "${reconciliation_roots[@]}" -maxdepth 2 -type f -name '*.json' -print0 | sudo tar --null -T - -cf "$RUNNER_TEMP/release-toolchain-active-reconciliation-evidence.tar"
            sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/release-toolchain-active-reconciliation-evidence.tar"
            # Only the explicitly private protocol-model journal. Do NOT
            # widen this to raw PM2 dumps or environment-bearing vault files.
            sudo find "${reconciliation_roots[@]}" -maxdepth 3 -type f -path '*/protocol-journal/*.json' -print0 | sudo tar --null -T - -cf "$RUNNER_TEMP/release-toolchain-publication-protocol-evidence.tar"
            sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/release-toolchain-publication-protocol-evidence.tar"
            # Only observational continuation receipts/manifests; never the
            # predecessor vault's raw dump or environment-bearing evidence.
            sudo find "${reconciliation_roots[@]}" -maxdepth 3 -type f -path '*/post-save-vault/*.json' -print0 | sudo tar --null -T - -cf "$RUNNER_TEMP/release-toolchain-post-save-evidence.tar"
            sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/release-toolchain-post-save-evidence.tar"
          fi
      - name: Preserve Synthetic Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-toolchain-ingress-evidence
          path: |
            /tmp/faolla-release-toolchain-lab-*/**/*.json
            ${{ runner.temp }}/release-toolchain-native-evidence.tar
            ${{ runner.temp }}/release-toolchain-equivalence-evidence.tar
            ${{ runner.temp }}/release-toolchain-active-lock-evidence.tar
            ${{ runner.temp }}/release-toolchain-pre-control-evidence.tar
            ${{ runner.temp }}/release-toolchain-python-runtime-evidence.tar
            ${{ runner.temp }}/release-toolchain-preconnect-evidence.tar
            ${{ runner.temp }}/release-toolchain-pre-intent-evidence.tar
            ${{ runner.temp }}/release-toolchain-active-vault-evidence.tar
            ${{ runner.temp }}/release-toolchain-active-metadata-evidence.tar
            ${{ runner.temp }}/release-toolchain-active-reconciliation-evidence.tar
            ${{ runner.temp }}/release-toolchain-publication-protocol-evidence.tar
            ${{ runner.temp }}/release-toolchain-post-save-evidence.tar
          if-no-files-found: warn
