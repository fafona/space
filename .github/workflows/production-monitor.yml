name: Production Monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      require_v1_ready:
        description: Fail until every V1 migration is applied
        required: false
        default: false
        type: boolean

concurrency:
  group: production-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FAOLLA_PRODUCTION_ORIGIN: https://faolla.com
      FAOLLA_PRODUCTION_SMOKE_PATHS: /,/login,/10909094,/admin
      FAOLLA_REQUIRE_V1_READY: ${{ inputs.require_v1_ready || 'false' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Check Production Operations
        run: >
          node scripts/check-production-operations.mjs
          --output production-operations-report.json

      - name: Write Monitor Summary
        if: always()
        shell: bash
        run: |
          echo "### Production operations monitor" >> "$GITHUB_STEP_SUMMARY"
          if [ -f production-operations-report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat production-operations-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The monitor stopped before producing a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Monitor Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-operations-report
          path: production-operations-report.json
          if-no-files-found: ignore
          retention-days: 14
