name: Production Monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      require_v1_ready:
        description: Fail until every V1 migration is applied
        required: false
        default: false
        type: boolean

concurrency:
  group: production-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          scan_ok=0
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts; then
              scan_ok=1
              break
            fi
            sleep 5
          done
          if [ "$scan_ok" != "1" ]; then
            echo "::warning::ssh-keyscan failed; the monitor will use accept-new host verification."
          fi

      - name: Check Production Operations
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
          REQUIRE_V1_READY: ${{ inputs.require_v1_ready || 'false' }}
        shell: bash
        run: |
          test -n "$SSH_USER"
          test -n "$APP_DIR"
          set -o pipefail
          require_flag=""
          if [ "$REQUIRE_V1_READY" = "true" ]; then
            require_flag="--require-v1-ready"
          fi
          ssh -o ConnectTimeout=20 -o ConnectionAttempts=3 -o StrictHostKeyChecking=accept-new -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "cd '$APP_DIR' && node --env-file=.env.local scripts/check-production-operations.mjs --json $require_flag" \
            | tee production-operations-report.log

      - name: Write Monitor Summary
        if: always()
        shell: bash
        run: |
          echo "### Production operations monitor" >> "$GITHUB_STEP_SUMMARY"
          if [ -f production-operations-report.log ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat production-operations-report.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The monitor stopped before producing a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Monitor Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-operations-report
          path: production-operations-report.log
          if-no-files-found: ignore
          retention-days: 14
