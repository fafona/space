name: Owned Checkout Runtime Metadata

on:
  push:
    branches:
      - acceptance/member-checkout-runtime-plan-20261126

permissions:
  contents: read

jobs:
  owned-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 20.20.1
      - name: Pure metadata projections and refusals
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap scripts/member-checkout-runtime-metadata.test.mjs | tee "$RUNNER_TEMP/checkout-runtime-metadata.tap"
      - name: Own Linux process and isolated Kong format
        run: node scripts/member-checkout-runtime-metadata-owned.mjs
      - name: Retain owned metadata results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-runtime-metadata-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/checkout-runtime-metadata.tap
            ${{ runner.temp }}/checkout-runtime-metadata-owned.json
          if-no-files-found: warn
          retention-days: 14
