name: Recover Failed Pre-Forward Production Runtime

on:
  workflow_dispatch:
    inputs:
      recovery_source_sha:
        description: Exact current main SHA containing the incident recovery implementation
        required: true
        type: string
      confirmation:
        description: Exact incident recovery confirmation
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  actions: read
  attestations: read
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RECOVERY_SOURCE_SHA: ${{ inputs.recovery_source_sha }}
      RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_CONFIRMATION: RECOVER_FAILED_PRE_FORWARD_DEPLOY_32574586077
      RECOVERY_WORKFLOW_NAME: Recover Failed Pre-Forward Production Runtime
      RECOVERY_WORKFLOW_PATH: .github/workflows/recover-failed-pre-forward-deploy.yml
      RECOVERY_WORKFLOW_FILE: recover-failed-pre-forward-deploy.yml
      CI_WORKFLOW_NAME: CI
      CI_WORKFLOW_PATH: .github/workflows/ci.yml
      INCIDENT_DEPLOY_RUN_ID: "32574586077"
      INCIDENT_DEPLOY_RUN_ATTEMPT: "1"
      INCIDENT_DEPLOY_WORKFLOW_NAME: Deploy Production
      INCIDENT_DEPLOY_WORKFLOW_PATH: .github/workflows/deploy.yml
      INCIDENT_SHA: 4381e6b555262d7fba696825c125c7793d6515f5
      READINESS_RUN_ID: "32574534420"
      READINESS_RUN_ATTEMPT: "1"
      READINESS_WORKFLOW_NAME: Ordinary Account Cutover Readiness
      READINESS_WORKFLOW_PATH: .github/workflows/ordinary-account-cutover-readiness.yml
      INCIDENT_OLD_BUILD_ID: 2a121454a18a16ae30e356977ca82b24a310e8e5
      SSH_ALIAS: faolla-incident-recovery

    steps:
      - name: Validate Unique Manual Recovery Chain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_NAME" = "main"
          test "$GITHUB_REPOSITORY" = "fafona/space"
          test "$RECOVERY_CONFIRMATION" = "$EXPECTED_CONFIRMATION"
          [[ "$RECOVERY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$RECOVERY_SOURCE_SHA" = "$GITHUB_SHA"
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_RUN_ATTEMPT" = "1"

          current_run="$RUNNER_TEMP/current-recovery-run.json"
          workflow_definition="$RUNNER_TEMP/current-recovery-workflow.json"
          workflow_runs="$RUNNER_TEMP/current-recovery-workflow-runs.json"
          ci_runs="$RUNNER_TEMP/recovery-source-ci-runs.json"
          ci_workflow="$RUNNER_TEMP/ci-workflow.json"

          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$current_run"
          recovery_workflow_id="$(node --input-type=module - "$current_run" <<'NODE'
          import { readFileSync } from "node:fs";

          const fail = (code) => {
            process.stderr.write(`${code}\n`);
            process.exit(1);
          };
          const run = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (
            run?.id !== Number(process.env.GITHUB_RUN_ID) ||
            run.run_attempt !== 1 ||
            run.event !== "workflow_dispatch" ||
            run.name !== process.env.RECOVERY_WORKFLOW_NAME ||
            run.path !== process.env.RECOVERY_WORKFLOW_PATH ||
            run.head_branch !== "main" ||
            run.head_sha !== process.env.RECOVERY_SOURCE_SHA ||
            !["queued", "in_progress"].includes(run.status) ||
            run.conclusion !== null ||
            run.repository?.full_name !== process.env.GITHUB_REPOSITORY ||
            run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY ||
            !Number.isSafeInteger(run.workflow_id) || run.workflow_id <= 0
          ) fail("recovery_current_run_invalid");
          process.stdout.write(String(run.workflow_id));
          NODE
          )"
          [[ "$recovery_workflow_id" =~ ^[1-9][0-9]*$ ]]
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$recovery_workflow_id" \
            > "$workflow_definition"
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/recover-failed-pre-forward-deploy.yml/runs?branch=main&event=workflow_dispatch&head_sha=$RECOVERY_SOURCE_SHA&per_page=2&page=1" \
            > "$workflow_runs"
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$RECOVERY_SOURCE_SHA&per_page=2&page=1" \
            > "$ci_runs"
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" > "$ci_workflow"

          node --input-type=module - \
            "$workflow_definition" "$workflow_runs" "$ci_runs" "$ci_workflow" \
            "$recovery_workflow_id" <<'NODE'
          import { readFileSync } from "node:fs";

          const fail = (code) => {
            process.stderr.write(`${code}\n`);
            process.exit(1);
          };
          const workflow = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const workflowPage = JSON.parse(readFileSync(process.argv[3], "utf8"));
          const ciPage = JSON.parse(readFileSync(process.argv[4], "utf8"));
          const ciWorkflow = JSON.parse(readFileSync(process.argv[5], "utf8"));
          const workflowId = Number(process.argv[6]);
          if (
            workflow?.id !== workflowId ||
            workflow.name !== process.env.RECOVERY_WORKFLOW_NAME ||
            workflow.path !== process.env.RECOVERY_WORKFLOW_PATH ||
            workflow.state !== "active"
          ) fail("recovery_workflow_definition_invalid");
          const exactSingleRun = (page, invalidCode, uniquenessCode) => {
            if (
              !page || !Number.isSafeInteger(page.total_count) ||
              !Array.isArray(page.workflow_runs)
            ) fail(invalidCode);
            if (page.total_count !== 1 || page.workflow_runs.length !== 1) {
              fail(uniquenessCode);
            }
            return page.workflow_runs[0];
          };
          const candidate = exactSingleRun(
            workflowPage,
            "recovery_workflow_runs_invalid",
            "recovery_dispatch_not_unique",
          );
          if (
            candidate?.id !== Number(process.env.GITHUB_RUN_ID) ||
            candidate.workflow_id !== workflowId ||
            candidate.run_attempt !== 1 ||
            candidate.event !== "workflow_dispatch" ||
            candidate.head_branch !== "main" ||
            candidate.head_sha !== process.env.RECOVERY_SOURCE_SHA
          ) fail("recovery_dispatch_not_unique");
          if (
            !Number.isSafeInteger(ciWorkflow?.id) || ciWorkflow.id <= 0 ||
            ciWorkflow?.name !== "CI" ||
            ciWorkflow.path !== ".github/workflows/ci.yml" ||
            ciWorkflow.state !== "active"
          ) fail("recovery_ci_workflow_invalid");
          const ci = exactSingleRun(
            ciPage,
            "recovery_ci_runs_invalid",
            "recovery_ci_not_unique",
          );
          if (
            !Number.isSafeInteger(ci?.id) || ci.id <= 0 ||
            ci.workflow_id !== ciWorkflow.id ||
            ci.name !== "CI" ||
            ci.path !== ".github/workflows/ci.yml" ||
            ci.event !== "push" ||
            ci.head_sha !== process.env.RECOVERY_SOURCE_SHA ||
            ci.status !== "completed" ||
            ci.conclusion !== "success" ||
            ci.head_branch !== "main" ||
            ci.run_attempt !== 1 ||
            ci.repository?.full_name !== process.env.GITHUB_REPOSITORY ||
            ci.head_repository?.full_name !== process.env.GITHUB_REPOSITORY
          ) fail("recovery_ci_invalid");
          NODE
          rm -f -- \
            "$current_run" "$workflow_definition" "$workflow_runs" \
            "$ci_runs" "$ci_workflow"
          printf '%s\n' 'incident_recovery_chain_verified'

      - name: Checkout Exact Recovery Source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.recovery_source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Exact Current Main Checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RECOVERY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RECOVERY_SOURCE_SHA"
          test -z "$(git symbolic-ref -q HEAD 2>/dev/null || true)"
          git fetch --no-tags --depth=1 origin \
            main:refs/remotes/origin/main >/dev/null 2>&1
          test "$(git rev-parse origin/main)" = "$RECOVERY_SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git hash-object scripts/recover-failed-pre-forward-production-runtime.sh)" = \
            "$(git rev-parse "$RECOVERY_SOURCE_SHA:scripts/recover-failed-pre-forward-production-runtime.sh")"
          bash -n scripts/recover-failed-pre-forward-production-runtime.sh

      - name: Validate Failed Deploy And Readiness Boundary
        id: incident-boundary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          deploy_run="$RUNNER_TEMP/incident-deploy-run.json"
          deploy_jobs="$RUNNER_TEMP/incident-deploy-jobs.json"
          deploy_workflow="$RUNNER_TEMP/incident-deploy-workflow.json"
          deploy_runs="$RUNNER_TEMP/incident-deploy-runs.json"
          readiness_run="$RUNNER_TEMP/incident-readiness-run.json"
          readiness_jobs="$RUNNER_TEMP/incident-readiness-jobs.json"
          readiness_workflow="$RUNNER_TEMP/incident-readiness-workflow.json"
          readiness_runs="$RUNNER_TEMP/incident-readiness-runs.json"

          gh api --method GET -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_DEPLOY_RUN_ID" > "$deploy_run"
          gh api --method GET -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_DEPLOY_RUN_ID/attempts/1/jobs" > "$deploy_jobs"
          gh api --method GET -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml" > "$deploy_workflow"
          gh api --method GET --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&event=workflow_run&per_page=100" \
            > "$deploy_runs"
          gh api --method GET -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$READINESS_RUN_ID" > "$readiness_run"
          gh api --method GET -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$READINESS_RUN_ID/attempts/1/jobs" > "$readiness_jobs"
          gh api --method GET -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ordinary-account-cutover-readiness.yml" \
            > "$readiness_workflow"
          gh api --method GET --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ordinary-account-cutover-readiness.yml/runs?branch=main&event=workflow_dispatch&per_page=100" \
            > "$readiness_runs"

          node --input-type=module - \
            "$deploy_run" "$deploy_jobs" "$deploy_workflow" "$deploy_runs" \
            "$readiness_run" "$readiness_jobs" "$readiness_workflow" \
            "$readiness_runs" <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const fail = (code) => {
            process.stderr.write(`${code}\n`);
            process.exit(1);
          };
          const deploy = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const deployJobsPage = JSON.parse(readFileSync(process.argv[3], "utf8"));
          const deployWorkflow = JSON.parse(readFileSync(process.argv[4], "utf8"));
          const deployRunPages = JSON.parse(readFileSync(process.argv[5], "utf8"));
          const readiness = JSON.parse(readFileSync(process.argv[6], "utf8"));
          const readinessJobsPage = JSON.parse(readFileSync(process.argv[7], "utf8"));
          const readinessWorkflow = JSON.parse(readFileSync(process.argv[8], "utf8"));
          const readinessRunPages = JSON.parse(readFileSync(process.argv[9], "utf8"));
          const canonicalTime = (value, code) => {
            if (typeof value !== "string") fail(code);
            const milliseconds = Date.parse(value);
            if (!Number.isFinite(milliseconds)) fail(code);
            return Math.floor(milliseconds / 1000);
          };
          if (
            deploy?.id !== Number(process.env.INCIDENT_DEPLOY_RUN_ID) ||
            deploy.run_attempt !== 1 ||
            deploy.name !== "Deploy Production" ||
            deploy.path !== ".github/workflows/deploy.yml" ||
            deploy.event !== "workflow_run" ||
            deploy.status !== "completed" ||
            deploy.conclusion !== "failure" ||
            deploy.head_branch !== "main" ||
            deploy.head_sha !== process.env.INCIDENT_SHA ||
            deploy.repository?.full_name !== process.env.GITHUB_REPOSITORY ||
            deploy.head_repository?.full_name !== process.env.GITHUB_REPOSITORY ||
            !Number.isSafeInteger(deploy.workflow_id) || deploy.workflow_id <= 0
          ) fail("incident_deploy_run_invalid");
          if (
            deployWorkflow?.id !== deploy.workflow_id ||
            deployWorkflow.name !== "Deploy Production" ||
            deployWorkflow.path !== ".github/workflows/deploy.yml" ||
            deployWorkflow.state !== "active"
          ) fail("incident_deploy_workflow_invalid");
          if (!Array.isArray(deployRunPages) || deployRunPages.length === 0) {
            fail("incident_deploy_children_invalid");
          }
          const childRuns = deployRunPages.flatMap((page) => {
            if (!page || !Array.isArray(page.workflow_runs)) {
              fail("incident_deploy_children_invalid");
            }
            return page.workflow_runs;
          });
          const matchingChildren = childRuns.filter(
            (run) => run?.head_sha === process.env.INCIDENT_SHA,
          );
          if (
            matchingChildren.length !== 1 ||
            matchingChildren[0].id !== Number(process.env.INCIDENT_DEPLOY_RUN_ID) ||
            matchingChildren[0].run_attempt !== 1
          ) fail("incident_deploy_child_not_unique");
          const deployJobs = deployJobsPage?.jobs;
          if (!Array.isArray(deployJobs) || deployJobs.length !== 1) {
            fail("incident_deploy_jobs_invalid");
          }
          const deployJob = deployJobs[0];
          if (
            deployJob.name !== "deploy" || deployJob.conclusion !== "failure" ||
            deployJob.run_attempt !== 1 || !Array.isArray(deployJob.steps) ||
            deployJob.steps.length !== 12
          ) fail("incident_deploy_job_invalid");
          const expectedDeploySteps = [
            [1, "Set up job", "success"],
            [2, "Validate Readiness Workflow Run", "success"],
            [3, "Checkout Tested Commit", "success"],
            [4, "Resolve Deploy Commit", "success"],
            [5, "Resolve Readiness Artifacts", "success"],
            [6, "Verify Readiness Evidence", "success"],
            [7, "Revalidate Live Recursive Backup Evidence", "success"],
            [8, "Setup SSH", "success"],
            [9, "Deploy To Server", "failure"],
            [10, "Verify Public Release", "skipped"],
            [20, "Post Checkout Tested Commit", "success"],
            [21, "Complete job", "success"],
          ];
          if (deployJob.steps.some((step, index) =>
            step.number !== expectedDeploySteps[index][0] ||
            step.name !== expectedDeploySteps[index][1] ||
            step.conclusion !== expectedDeploySteps[index][2]
          )) fail("incident_deploy_steps_invalid");
          const businessSteps = deployJob.steps.filter(
            (step) => step.number >= 2 && step.number <= 10,
          );
          if (businessSteps.length !== 9) fail("incident_deploy_business_steps_invalid");
          const startedEpoch = canonicalTime(deployJob.started_at, "incident_started_at_invalid");
          const completedEpoch = canonicalTime(deployJob.completed_at, "incident_completed_at_invalid");
          if (completedEpoch <= startedEpoch || completedEpoch - startedEpoch > 10_800) {
            fail("incident_time_window_invalid");
          }

          if (
            readiness?.id !== Number(process.env.READINESS_RUN_ID) ||
            readiness.run_attempt !== 1 ||
            readiness.name !== "Ordinary Account Cutover Readiness" ||
            readiness.path !== ".github/workflows/ordinary-account-cutover-readiness.yml" ||
            readiness.event !== "workflow_dispatch" ||
            readiness.status !== "completed" || readiness.conclusion !== "success" ||
            readiness.head_branch !== "main" || readiness.head_sha !== process.env.INCIDENT_SHA ||
            readiness.repository?.full_name !== process.env.GITHUB_REPOSITORY ||
            readiness.head_repository?.full_name !== process.env.GITHUB_REPOSITORY ||
            !Number.isSafeInteger(readiness.workflow_id) || readiness.workflow_id <= 0
          ) fail("incident_readiness_run_invalid");
          if (
            readinessWorkflow?.id !== readiness.workflow_id ||
            readinessWorkflow.name !== "Ordinary Account Cutover Readiness" ||
            readinessWorkflow.path !== ".github/workflows/ordinary-account-cutover-readiness.yml" ||
            readinessWorkflow.state !== "active"
          ) fail("incident_readiness_workflow_invalid");
          if (!Array.isArray(readinessRunPages) || readinessRunPages.length === 0) {
            fail("incident_readiness_runs_invalid");
          }
          const readinessRuns = readinessRunPages.flatMap((page) => {
            if (!page || !Array.isArray(page.workflow_runs)) {
              fail("incident_readiness_runs_invalid");
            }
            return page.workflow_runs;
          });
          const matchingReadinessRuns = readinessRuns.filter(
            (run) => run?.head_sha === process.env.INCIDENT_SHA,
          );
          if (
            matchingReadinessRuns.length !== 1 ||
            matchingReadinessRuns[0].id !== Number(process.env.READINESS_RUN_ID) ||
            matchingReadinessRuns[0].run_attempt !== 1
          ) fail("incident_readiness_not_unique");
          const readinessJobs = readinessJobsPage?.jobs;
          if (!Array.isArray(readinessJobs) || readinessJobs.length !== 1) {
            fail("incident_readiness_jobs_invalid");
          }
          const readinessJob = readinessJobs[0];
          const expectedReadinessSteps = [
            [1, "Set up job", "success"],
            [2, "Validate Manual Release Chain", "success"],
            [3, "Checkout Exact Readiness Source", "success"],
            [4, "Verify Exact Current Main Checkout", "success"],
            [5, "Resolve Exact Successful Backup Artifact Inventory", "success"],
            [6, "Verify Recursive Backup Attestation Chain", "success"],
            [7, "Setup Pinned SSH Host Trust", "success"],
            [8, "Prepare Remote Detached Exact Source", "success"],
            [9, "Inspect Locked Production Readiness From Exact Source", "success"],
            [10, "Upload Canonical Readiness Report", "success"],
            [11, "Verify Uploaded Readiness Report Artifact", "success"],
            [12, "Enforce Ready Cutover State", "success"],
            [13, "Build Canonical Readiness Attestation", "success"],
            [14, "Upload Canonical Readiness Attestation", "success"],
            [15, "Verify Uploaded Readiness Attestation Artifact", "success"],
            [16, "Attest Canonical Readiness Report", "success"],
            [17, "Attest Canonical Readiness Attestation", "success"],
            [18, "Confirm Exact Successful Readiness Artifact Inventory", "success"],
            [19, "Remove Remote Exact Readiness Source", "success"],
            [38, "Post Checkout Exact Readiness Source", "success"],
            [39, "Complete job", "success"],
          ];
          if (
            readinessJob?.name !== "readiness" || readinessJob.conclusion !== "success" ||
            readinessJob.run_attempt !== 1 || !Array.isArray(readinessJob.steps) ||
            readinessJob.steps.length !== expectedReadinessSteps.length ||
            readinessJob.steps.some((step, index) =>
              step.number !== expectedReadinessSteps[index][0] ||
              step.name !== expectedReadinessSteps[index][1] ||
              step.conclusion !== expectedReadinessSteps[index][2]
            )
          ) fail("incident_readiness_job_invalid");
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `failed_run_started_epoch=${startedEpoch}\nfailed_run_completed_epoch=${completedEpoch}\n`,
          );
          NODE
          rm -f -- \
            "$deploy_run" "$deploy_jobs" "$deploy_workflow" "$deploy_runs" \
            "$readiness_run" "$readiness_jobs" "$readiness_workflow" \
            "$readiness_runs"

      - name: Resolve Exact Readiness Artifact Inventory
        id: readiness-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          pages="$RUNNER_TEMP/readiness-artifact-pages.json"
          details="$RUNNER_TEMP/readiness-artifact-details"
          mkdir "$details"
          gh api --method GET --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$READINESS_RUN_ID/artifacts?per_page=100" \
            > "$pages"
          artifact_ids="$(node --input-type=module - "$pages" <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const fail = (code) => {
            process.stderr.write(`${code}\n`);
            process.exit(1);
          };
          const pages = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (!Array.isArray(pages) || pages.length === 0) {
            fail("readiness_artifact_inventory_invalid");
          }
          const artifacts = pages.flatMap((page) => {
            if (!page || !Array.isArray(page.artifacts) || page.total_count !== 2) {
              fail("readiness_artifact_inventory_invalid");
            }
            return page.artifacts;
          });
          if (artifacts.length !== 2) fail("readiness_artifact_inventory_invalid");
          const expected = new Map([
            [`faolla-production-readiness-report-${process.env.READINESS_RUN_ID}-1`, "report"],
            [`faolla-production-readiness-attestation-${process.env.READINESS_RUN_ID}-1`, "attestation"],
          ]);
          const now = Date.now();
          const seenIds = new Set();
          const outputs = new Map();
          for (const artifact of artifacts) {
            const role = expected.get(artifact?.name);
            if (!role || outputs.has(`${role}_id`)) fail("readiness_artifact_inventory_invalid");
            if (
              !Number.isSafeInteger(artifact.id) || artifact.id <= 0 || seenIds.has(artifact.id) ||
              !Number.isSafeInteger(artifact.size_in_bytes) || artifact.size_in_bytes <= 0 ||
              artifact.size_in_bytes > 2 * 1024 * 1024 ||
              artifact.expired !== false ||
              !/^sha256:[0-9a-f]{64}$/.test(artifact.digest ?? "") ||
              artifact.workflow_run?.id !== Number(process.env.READINESS_RUN_ID) ||
              artifact.workflow_run?.head_branch !== "main" ||
              artifact.workflow_run?.head_sha !== process.env.INCIDENT_SHA ||
              !Number.isFinite(Date.parse(artifact.expires_at)) ||
              Date.parse(artifact.expires_at) <= now
            ) fail("readiness_artifact_inventory_invalid");
            seenIds.add(artifact.id);
            outputs.set(`${role}_id`, String(artifact.id));
            outputs.set(`${role}_digest`, artifact.digest);
          }
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            [...outputs].map(([key, value]) => `${key}=${value}\n`).join(""),
          );
          process.stdout.write([...seenIds].join("\n"));
          NODE
          )"
          while IFS= read -r artifact_id; do
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
            gh api --method GET -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              > "$details/$artifact_id.json"
          done <<< "$artifact_ids"
          node --input-type=module - "$pages" "$details" <<'NODE'
          import { readFileSync, readdirSync } from "node:fs";
          import { join } from "node:path";

          const pages = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const artifacts = pages.flatMap((page) => page.artifacts);
          const details = process.argv[3];
          const files = readdirSync(details).sort();
          const expectedFiles = artifacts.map((artifact) => `${artifact.id}.json`).sort();
          if (
            files.length !== 2 ||
            files.some((file, index) => file !== expectedFiles[index])
          ) process.exit(1);
          for (const artifact of artifacts) {
            const direct = JSON.parse(readFileSync(join(details, `${artifact.id}.json`), "utf8"));
            for (const key of [
              "id", "name", "size_in_bytes", "expired", "created_at", "expires_at", "digest",
            ]) {
              if (direct?.[key] !== artifact?.[key]) process.exit(1);
            }
            if (
              direct.workflow_run?.id !== Number(process.env.READINESS_RUN_ID) ||
              direct.workflow_run?.head_branch !== "main" ||
              direct.workflow_run?.head_sha !== process.env.INCIDENT_SHA
            ) process.exit(1);
          }
          NODE
          rm -f -- "$pages" "$details"/*.json
          rmdir -- "$details"

      - name: Verify Canonical Historical Readiness Evidence
        id: readiness-evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_ARTIFACT_ID: ${{ steps.readiness-artifacts.outputs.report_id }}
          REPORT_ARTIFACT_DIGEST: ${{ steps.readiness-artifacts.outputs.report_digest }}
          ATTESTATION_ARTIFACT_ID: ${{ steps.readiness-artifacts.outputs.attestation_id }}
          ATTESTATION_ARTIFACT_DIGEST: ${{ steps.readiness-artifacts.outputs.attestation_digest }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          evidence="$RUNNER_TEMP/incident-readiness-evidence"
          mkdir "$evidence"
          report_zip="$evidence/report.zip"
          attestation_zip="$evidence/attestation.zip"
          report_file="$evidence/production-readiness-report.json"
          attestation_file="$evidence/production-readiness-attestation.json"
          gh api --method GET -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$REPORT_ARTIFACT_ID/zip" > "$report_zip"
          gh api --method GET -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ATTESTATION_ARTIFACT_ID/zip" > "$attestation_zip"
          test "sha256:$(sha256sum "$report_zip" | awk '{print $1}')" = "$REPORT_ARTIFACT_DIGEST"
          test "sha256:$(sha256sum "$attestation_zip" | awk '{print $1}')" = "$ATTESTATION_ARTIFACT_DIGEST"
          extract_single_json() {
            python3 - "$1" "$2" "$3" <<'PYTHON'
          import os
          import stat
          import sys
          import zipfile

          archive, expected_name, destination = sys.argv[1:]
          maximum = 1024 * 1024
          with zipfile.ZipFile(archive, "r") as bundle:
              entries = bundle.infolist()
              if len(entries) != 1:
                  raise SystemExit("readiness_archive_inventory_invalid")
              entry = entries[0]
              mode = (entry.external_attr >> 16) & 0xFFFF
              if (
                  entry.filename != expected_name
                  or entry.is_dir()
                  or (entry.flag_bits & 0x1) != 0
                  or entry.file_size <= 0
                  or entry.file_size > maximum
                  or entry.compress_size <= 0
                  or entry.compress_size > 2 * maximum
                  or stat.S_ISLNK(mode)
                  or entry.compress_type not in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED)
              ):
                  raise SystemExit("readiness_archive_entry_invalid")
              payload = bundle.read(entry)
              if len(payload) != entry.file_size:
                  raise SystemExit("readiness_archive_size_invalid")
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
          if hasattr(os, "O_NOFOLLOW"):
              flags |= os.O_NOFOLLOW
          descriptor = os.open(destination, flags, 0o600)
          with os.fdopen(descriptor, "wb") as output:
              output.write(payload)
          PYTHON
          }
          extract_single_json "$report_zip" "production-readiness-report.json" "$report_file"
          extract_single_json "$attestation_zip" "production-readiness-attestation.json" "$attestation_file"
          rm -f -- "$report_zip" "$attestation_zip"

          signer_workflow="github.com/$GITHUB_REPOSITORY/$READINESS_WORKFLOW_PATH"
          verify_provenance() {
            local subject_file="$1"
            local subject_name="$2"
            local result_file="$3"
            local subject_sha
            subject_sha="$(sha256sum "$subject_file" | awk '{print $1}')"
            if ! gh attestation verify "$subject_file" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer_workflow" \
              --source-digest "$INCIDENT_SHA" \
              --source-ref "refs/heads/main" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --deny-self-hosted-runners --limit 10 --format json \
              > "$result_file" 2> /dev/null; then
              printf '%s\n' 'readiness_provenance_invalid' >&2
              return 1
            fi
            node --input-type=module - "$result_file" "$subject_name" "$subject_sha" <<'NODE'
          import { readFileSync } from "node:fs";
          const results = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const subjects = results?.[0]?.verificationResult?.statement?.subject;
          if (
            !Array.isArray(results) || results.length !== 1 ||
            !Array.isArray(subjects) || subjects.length !== 1 ||
            subjects[0]?.name !== process.argv[3] ||
            subjects[0]?.digest?.sha256 !== process.argv[4]
          ) process.exit(1);
          NODE
          }
          verify_provenance "$report_file" "production-readiness-report.json" "$evidence/report-provenance.json"
          verify_provenance "$attestation_file" "production-readiness-attestation.json" "$evidence/attestation-provenance.json"
          rm -f -- "$evidence/report-provenance.json" "$evidence/attestation-provenance.json"

          node --input-type=module - "$report_file" "$attestation_file" <<'NODE'
          import { createHash } from "node:crypto";
          import { appendFileSync, readFileSync } from "node:fs";
          import {
            canonicalJsonBytes,
            parseProductionReleaseAttestation,
          } from "./scripts/production-release-attestation.mjs";

          const fail = (code) => {
            process.stderr.write(`${code}\n`);
            process.exit(1);
          };
          const reportBytes = readFileSync(process.argv[2]);
          const attestationBytes = readFileSync(process.argv[3]);
          let report;
          let source;
          try {
            report = JSON.parse(reportBytes.toString("utf8"));
            source = JSON.parse(attestationBytes.toString("utf8"));
          } catch {
            fail("readiness_evidence_json_invalid");
          }
          if (!reportBytes.equals(canonicalJsonBytes(report))) {
            fail("readiness_report_not_canonical");
          }
          const issuedAt = source?.issuedAt;
          if (!Number.isFinite(Date.parse(issuedAt))) fail("readiness_issued_at_invalid");
          const attestation = parseProductionReleaseAttestation(source, {
            nowMs: Date.parse(issuedAt),
            expectedRepository: process.env.GITHUB_REPOSITORY,
            expectedTargetSha: process.env.INCIDENT_SHA,
            expectedRunId: process.env.READINESS_RUN_ID,
            expectedRunAttempt: process.env.READINESS_RUN_ATTEMPT,
            expectedReadinessRunId: process.env.READINESS_RUN_ID,
            expectedArtifactId: process.env.REPORT_ARTIFACT_ID,
            expectedArtifactDigest: process.env.REPORT_ARTIFACT_DIGEST,
            expectedReadinessArtifactId: process.env.REPORT_ARTIFACT_ID,
            expectedReadinessArtifactDigest: process.env.REPORT_ARTIFACT_DIGEST,
          });
          if (!attestationBytes.equals(canonicalJsonBytes(attestation))) {
            fail("readiness_attestation_not_canonical");
          }
          if (
            attestation.readinessArtifact?.file?.name !== "production-readiness-report.json" ||
            attestation.readinessArtifact.file.sizeBytes !== String(reportBytes.length) ||
            attestation.readinessArtifact.file.sha256 !==
              createHash("sha256").update(reportBytes).digest("hex") ||
            attestation.database?.primary !== true
          ) fail("readiness_report_binding_invalid");
          const database = attestation.database;
          const databasePayload = {
            DATABASE_CONTAINER_NAME: database.containerName,
            DATABASE_CONTAINER_ID: database.containerId,
            DATABASE_NAME: database.dbName,
            DATABASE_OID: database.dbOid,
            DATABASE_SYSTEM_ID: database.systemId,
            DATABASE_PRIMARY: String(database.primary),
          };
          const outputs = {
            database_container_name: databasePayload.DATABASE_CONTAINER_NAME,
            database_container_id: databasePayload.DATABASE_CONTAINER_ID,
            database_name: databasePayload.DATABASE_NAME,
            database_oid: databasePayload.DATABASE_OID,
            database_system_id: databasePayload.DATABASE_SYSTEM_ID,
            database_primary: databasePayload.DATABASE_PRIMARY,
          };
          for (const value of Object.values(outputs)) {
            process.stdout.write(`::add-mask::${value}\n`);
          }
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            Object.entries(outputs).map(([key, value]) => `${key}=${value}\n`).join(""),
          );
          NODE
          rm -f -- "$report_file" "$attestation_file"
          rmdir -- "$evidence"
          printf '%s\n' 'readiness_evidence_verified'

      - name: Setup Pinned SSH Recovery Alias
        env:
          SSH_CONFIG_PATH: ${{ runner.temp }}/faolla-incident-recovery-ssh-config
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          const values = {
            host: process.env.SSH_HOST ?? "",
            port: process.env.SSH_PORT || "22",
            user: process.env.SSH_USER ?? "",
            key: process.env.SSH_PRIVATE_KEY ?? "",
            knownHosts: process.env.SSH_KNOWN_HOSTS ?? "",
          };
          if (
            !/^(?:[A-Za-z0-9.-]+|[0-9A-Fa-f:]+)$/.test(values.host) ||
            !/^[1-9][0-9]{0,4}$/.test(values.port) || Number(values.port) > 65535 ||
            !/^[A-Za-z0-9._-]{1,64}$/.test(values.user) ||
            values.key.length === 0 || values.knownHosts.length === 0 ||
            [values.host, values.port, values.user].some((value) => /[\r\n\0\s]/.test(value))
          ) process.exit(1);
          NODE
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null 2>&1
          cat > "$SSH_CONFIG_PATH" <<EOF
          Host faolla-incident-recovery
            HostName $SSH_HOST
            User $SSH_USER
            Port ${SSH_PORT:-22}
            IdentityFile $HOME/.ssh/id_ed25519
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            GlobalKnownHostsFile /dev/null
            KnownHostsCommand none
            UpdateHostKeys no
            VerifyHostKeyDNS no
            PasswordAuthentication no
            KbdInteractiveAuthentication no
            GSSAPIAuthentication no
            ForwardAgent no
            ClearAllForwardings yes
            RequestTTY no
            ConnectTimeout 20
            ConnectionAttempts 1
            LogLevel ERROR
          EOF
          chmod 600 "$SSH_CONFIG_PATH"

      - name: Revalidate Main And CI Immediately Before Recovery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            main:refs/remotes/origin/main >/dev/null 2>&1
          test "$(git rev-parse HEAD)" = "$RECOVERY_SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$RECOVERY_SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          ci_runs="$RUNNER_TEMP/final-recovery-source-ci-runs.json"
          recovery_runs="$RUNNER_TEMP/final-recovery-workflow-runs.json"
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$RECOVERY_SOURCE_SHA&per_page=2&page=1" \
            > "$ci_runs"
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/recover-failed-pre-forward-deploy.yml/runs?branch=main&event=workflow_dispatch&head_sha=$RECOVERY_SOURCE_SHA&per_page=2&page=1" \
            > "$recovery_runs"
          node --input-type=module - "$ci_runs" "$recovery_runs" <<'NODE'
          import { readFileSync } from "node:fs";
          const page = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const recoveryPage = JSON.parse(readFileSync(process.argv[3], "utf8"));
          const exactSingleRun = (value) => {
            if (
              !value || value.total_count !== 1 ||
              !Array.isArray(value.workflow_runs) || value.workflow_runs.length !== 1
            ) process.exit(1);
            return value.workflow_runs[0];
          };
          const run = exactSingleRun(page);
          if (
            !Number.isSafeInteger(run?.id) || run.id <= 0 ||
            !Number.isSafeInteger(run.workflow_id) || run.workflow_id <= 0 ||
            run.name !== "CI" || run.path !== ".github/workflows/ci.yml" ||
            run.event !== "push" || run.status !== "completed" ||
            run.conclusion !== "success" || run.head_branch !== "main" ||
            run.head_sha !== process.env.RECOVERY_SOURCE_SHA ||
            run.run_attempt !== 1 ||
            run.repository?.full_name !== process.env.GITHUB_REPOSITORY ||
            run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY
          ) process.exit(1);
          const recoveryRun = exactSingleRun(recoveryPage);
          if (
            recoveryRun?.id !== Number(process.env.GITHUB_RUN_ID) ||
            !Number.isSafeInteger(recoveryRun.workflow_id) || recoveryRun.workflow_id <= 0 ||
            recoveryRun.run_attempt !== 1 ||
            recoveryRun.event !== "workflow_dispatch" ||
            recoveryRun.head_branch !== "main" ||
            recoveryRun.head_sha !== process.env.RECOVERY_SOURCE_SHA ||
            recoveryRun.status !== "in_progress" ||
            recoveryRun.conclusion !== null ||
            recoveryRun.repository?.full_name !== process.env.GITHUB_REPOSITORY ||
            recoveryRun.head_repository?.full_name !== process.env.GITHUB_REPOSITORY
          ) process.exit(1);
          NODE
          rm -f -- "$ci_runs" "$recovery_runs"

      - name: Recover Frozen Production Runtime
        env:
          SSH_CONFIG_PATH: ${{ runner.temp }}/faolla-incident-recovery-ssh-config
          APP_DIR: ${{ secrets.APP_DIR }}
          APP_NAME: ${{ secrets.APP_NAME }}
          APP_PORT: ${{ secrets.APP_PORT }}
          DATABASE_CONTAINER_NAME: ${{ steps.readiness-evidence.outputs.database_container_name }}
          DATABASE_CONTAINER_ID: ${{ steps.readiness-evidence.outputs.database_container_id }}
          DATABASE_NAME: ${{ steps.readiness-evidence.outputs.database_name }}
          DATABASE_OID: ${{ steps.readiness-evidence.outputs.database_oid }}
          DATABASE_SYSTEM_ID: ${{ steps.readiness-evidence.outputs.database_system_id }}
          DATABASE_PRIMARY: ${{ steps.readiness-evidence.outputs.database_primary }}
          FAILED_RUN_STARTED_EPOCH: ${{ steps.incident-boundary.outputs.failed_run_started_epoch }}
          FAILED_RUN_COMPLETED_EPOCH: ${{ steps.incident-boundary.outputs.failed_run_completed_epoch }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          payload_path="$RUNNER_TEMP/failed-pre-forward-recovery-payload.json"
          envelope_path="$RUNNER_TEMP/failed-pre-forward-recovery-envelope.bin"
          RECOVERY_ENVELOPE_PATH="$envelope_path"
          RECOVERY_STDOUT_PATH="$RUNNER_TEMP/failed-pre-forward-recovery.stdout"
          RECOVERY_STDERR_PATH="$RUNNER_TEMP/failed-pre-forward-recovery.stderr"
          export RECOVERY_ENVELOPE_PATH RECOVERY_STDOUT_PATH RECOVERY_STDERR_PATH
          cleanup_runner_recovery_files() {
            rm -f -- "$payload_path" "$RECOVERY_ENVELOPE_PATH" \
              "$RECOVERY_STDOUT_PATH" "$RECOVERY_STDERR_PATH"
          }
          trap cleanup_runner_recovery_files EXIT
          : > "$RECOVERY_STDOUT_PATH"
          : > "$RECOVERY_STDERR_PATH"
          chmod 600 "$RECOVERY_STDOUT_PATH" "$RECOVERY_STDERR_PATH"
          APP_NAME="${APP_NAME:-merchant-space}"
          APP_PORT="${APP_PORT:-3000}"
          export APP_DIR APP_NAME APP_PORT

          node --input-type=module - "$payload_path" <<'NODE'
          import { createHash } from "node:crypto";
          import { constants, writeFileSync } from "node:fs";

          const values = {
            APP_DIR: process.env.APP_DIR ?? "",
            APP_NAME: process.env.APP_NAME ?? "",
            APP_PORT: process.env.APP_PORT ?? "",
            CONFIRMATION: process.env.RECOVERY_CONFIRMATION ?? "",
            DATABASE_CONTAINER_ID: process.env.DATABASE_CONTAINER_ID ?? "",
            DATABASE_CONTAINER_NAME: process.env.DATABASE_CONTAINER_NAME ?? "",
            DATABASE_NAME: process.env.DATABASE_NAME ?? "",
            DATABASE_OID: process.env.DATABASE_OID ?? "",
            DATABASE_PRIMARY: process.env.DATABASE_PRIMARY ?? "",
            DATABASE_SYSTEM_ID: process.env.DATABASE_SYSTEM_ID ?? "",
            FAILED_RUN_COMPLETED_EPOCH: process.env.FAILED_RUN_COMPLETED_EPOCH ?? "",
            FAILED_RUN_STARTED_EPOCH: process.env.FAILED_RUN_STARTED_EPOCH ?? "",
            INCIDENT_DEPLOY_RUN_ID: process.env.INCIDENT_DEPLOY_RUN_ID ?? "",
            INCIDENT_SHA: process.env.INCIDENT_SHA ?? "",
            READINESS_RUN_ATTEMPT: process.env.READINESS_RUN_ATTEMPT ?? "",
            READINESS_RUN_ID: process.env.READINESS_RUN_ID ?? "",
          };
          const keys = Object.keys(values).sort();
          if (
            keys.length !== 16 ||
            values.CONFIRMATION !== "RECOVER_FAILED_PRE_FORWARD_DEPLOY_32574586077" ||
            !/^\/[A-Za-z0-9._/-]{1,1023}$/.test(values.APP_DIR) ||
            !/^[A-Za-z0-9._-]{1,128}$/.test(values.APP_NAME) ||
            !/^[1-9][0-9]{0,4}$/.test(values.APP_PORT) || Number(values.APP_PORT) > 65535 ||
            !/^[0-9a-f]{64}$/.test(values.DATABASE_CONTAINER_ID) ||
            !/^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$/.test(values.DATABASE_CONTAINER_NAME) ||
            !/^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$/.test(values.DATABASE_NAME) ||
            !/^[1-9][0-9]*$/.test(values.DATABASE_OID) ||
            !/^[1-9][0-9]{9,19}$/.test(values.DATABASE_SYSTEM_ID) ||
            values.DATABASE_PRIMARY !== "true" ||
            values.INCIDENT_DEPLOY_RUN_ID !== "32574586077" ||
            values.INCIDENT_SHA !== "4381e6b555262d7fba696825c125c7793d6515f5" ||
            values.READINESS_RUN_ID !== "32574534420" ||
            values.READINESS_RUN_ATTEMPT !== "1" ||
            !/^[1-9][0-9]*$/.test(values.FAILED_RUN_STARTED_EPOCH) ||
            !/^[1-9][0-9]*$/.test(values.FAILED_RUN_COMPLETED_EPOCH)
          ) process.exit(1);
          const payloadBytes = Buffer.from(
            `${JSON.stringify(Object.fromEntries(keys.map((key) => [key, values[key]])))}\n`,
            "utf8",
          );
          if (payloadBytes.length <= 0 || payloadBytes.length > 65_536) process.exit(1);
          createHash("sha256").update(payloadBytes).digest("hex");
          writeFileSync(
            process.argv[2],
            payloadBytes,
            { flag: constants.O_WRONLY | constants.O_CREAT | constants.O_EXCL, mode: 0o600 },
          );
          NODE
          payloadBytes="$(wc -c < "$payload_path" | tr -d '[:space:]')"
          payloadSha256="$(sha256sum "$payload_path" | awk '{print $1}')"
          scriptBytes="$(wc -c < scripts/recover-failed-pre-forward-production-runtime.sh | tr -d '[:space:]')"
          scriptSha256="$(sha256sum scripts/recover-failed-pre-forward-production-runtime.sh | awk '{print $1}')"
          [[ "$payloadBytes" =~ ^[1-9][0-9]*$ ]]
          [[ "$payloadSha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$scriptBytes" =~ ^[1-9][0-9]*$ ]]
          [[ "$scriptSha256" =~ ^[0-9a-f]{64}$ ]]
          [ "$payloadBytes" -le 65536 ]
          [ "$scriptBytes" -le 131072 ]
          test "$(git hash-object scripts/recover-failed-pre-forward-production-runtime.sh)" = \
            "$(git rev-parse "$RECOVERY_SOURCE_SHA:scripts/recover-failed-pre-forward-production-runtime.sh")"
          {
            printf '%s\n' 'FAOLLA_FAILED_PRE_FORWARD_RECOVERY_ENVELOPE_V1'
            printf '%s\n' "$payloadBytes"
            printf '%s\n' "$payloadSha256"
            printf '%s\n' "$scriptBytes"
            printf '%s\n' "$scriptSha256"
            cat "$payload_path"
            cat scripts/recover-failed-pre-forward-production-runtime.sh
          } > "$RECOVERY_ENVELOPE_PATH"
          chmod 600 "$RECOVERY_ENVELOPE_PATH"
          rm -f -- "$payload_path"

          REMOTE_RECOVERY_COMMAND='set -eu; umask 077; recovery_transport_dir="$(mktemp -d)"; recovery_payload="$recovery_transport_dir/payload.json"; recovery_script="$recovery_transport_dir/recovery.sh"; cleanup_recovery_transport() { rm -f -- "$recovery_payload" "$recovery_script"; rmdir -- "$recovery_transport_dir"; }; trap cleanup_recovery_transport EXIT; IFS= read -r recovery_magic; test "$recovery_magic" = "FAOLLA_FAILED_PRE_FORWARD_RECOVERY_ENVELOPE_V1"; IFS= read -r expected_payload_bytes; IFS= read -r expected_payload_sha256; IFS= read -r expected_script_bytes; IFS= read -r expected_script_sha256; case "$expected_payload_bytes:$expected_script_bytes" in *[!0-9:]*|0:*|*:0) exit 1;; esac; test "$expected_payload_bytes" -le 65536; test "$expected_script_bytes" -le 131072; case "$expected_payload_sha256:$expected_script_sha256" in *[!0-9a-f:]*) exit 1;; esac; case "$expected_payload_sha256:$expected_script_sha256" in ????????????????????????????????????????????????????????????????:????????????????????????????????????????????????????????????????) :;; *) exit 1;; esac; dd bs=1 count="$expected_payload_bytes" of="$recovery_payload" status=none; dd bs=1 count="$expected_script_bytes" of="$recovery_script" status=none; test "$(dd bs=1 count=1 status=none | wc -c | tr -d "[:space:]")" = "0"; test "$(wc -c < "$recovery_payload" | tr -d "[:space:]")" = "$expected_payload_bytes"; test "$(sha256sum "$recovery_payload" | awk "{print \$1}")" = "$expected_payload_sha256"; test "$(wc -c < "$recovery_script" | tr -d "[:space:]")" = "$expected_script_bytes"; test "$(sha256sum "$recovery_script" | awk "{print \$1}")" = "$expected_script_sha256"; chmod 600 "$recovery_payload"; chmod 700 "$recovery_script"; FAOLLA_RECOVERY_PAYLOAD_FILE="$recovery_payload" bash "$recovery_script"'
          export REMOTE_RECOVERY_COMMAND
          set +e
          (
            ulimit -f 16
            timeout --signal=TERM --kill-after=10s 900s \
              ssh -T -F "$SSH_CONFIG_PATH" "$SSH_ALIAS" "$REMOTE_RECOVERY_COMMAND" \
              < "$RECOVERY_ENVELOPE_PATH" \
              > "$RECOVERY_STDOUT_PATH" 2> "$RECOVERY_STDERR_PATH"
          )
          ssh_status=$?
          set -e
          classification="$(node --input-type=module - \
            "$RECOVERY_STDOUT_PATH" "$RECOVERY_STDERR_PATH" "$ssh_status" <<'NODE'
          import { readFileSync } from "node:fs";

          const stdout = readFileSync(process.argv[2]);
          const stderr = readFileSync(process.argv[3]);
          const status = Number(process.argv[4]);
          const expectedLines = [
            "fence_cleanup_verified",
            "frozen_runtime_restored",
            "worker_state_restored",
            "recovery_complete",
          ];
          const expected = Buffer.from(`${expectedLines.join("\n")}\n`, "utf8");
          const allowedPrefixes = new Set(
            Array.from({ length: expectedLines.length + 1 }, (_, length) =>
              Buffer.from(
                length === 0 ? "" : `${expectedLines.slice(0, length).join("\n")}\n`,
                "utf8",
              ).toString("base64"),
            ),
          );
          if (status === 0) {
            if (!stdout.equals(expected) || stderr.length !== 0) {
              process.stdout.write("recovery_output_invalid");
            } else {
              process.stdout.write("success");
            }
            process.exit(0);
          }
          if (!allowedPrefixes.has(stdout.toString("base64"))) {
            process.stdout.write("recovery_output_invalid");
          } else if (stderr.equals(Buffer.from("cleanup_unverified\n", "utf8"))) {
            process.stdout.write("remote_cleanup_unverified");
          } else if (stderr.equals(Buffer.from("recovery_failed\n", "utf8"))) {
            process.stdout.write("remote_recovery_failed");
          } else {
            process.stdout.write("recovery_output_invalid");
          }
          NODE
          )"
          if [ "$classification" != "success" ]; then
            case "$classification" in
              remote_cleanup_unverified|remote_recovery_failed|recovery_output_invalid)
                printf '%s\n' "$classification"
                ;;
              *) printf '%s\n' 'recovery_output_invalid' ;;
            esac
            exit 1
          fi
          printf '%s\n' 'fence_cleanup_verified'
          printf '%s\n' 'frozen_runtime_restored'
          printf '%s\n' 'worker_state_restored'
          printf '%s\n' 'recovery_complete'

      - name: Verify Public Frozen Runtime Recovery
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          smoke_stdout="$RUNNER_TEMP/recovery-public-smoke.stdout"
          smoke_stderr="$RUNNER_TEMP/recovery-public-smoke.stderr"
          trap 'rm -f -- "$smoke_stdout" "$smoke_stderr"' EXIT
          : > "$smoke_stdout"
          : > "$smoke_stderr"
          chmod 600 "$smoke_stdout" "$smoke_stderr"
          set +e
          (
            ulimit -f 32
            node scripts/check-production-smoke.mjs \
              --origin https://faolla.com \
              --paths /,/login,/10909094,/admin \
              --expected-build "$INCIDENT_OLD_BUILD_ID" \
              --attempts 8 \
              --delay-ms 2000 \
              --timeout-ms 12000 \
              > "$smoke_stdout" 2> "$smoke_stderr"
          )
          smoke_status=$?
          set -e
          if [ "$smoke_status" -ne 0 ]; then
            printf '%s\n' 'public_smoke_failed'
            exit 1
          fi
          printf '%s\n' 'public_smoke_verified'
