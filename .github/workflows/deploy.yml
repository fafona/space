name: Deploy Production

on:
  workflow_run:
    workflows:
      - Ordinary Account Cutover Readiness
    types:
      - completed

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  actions: read
  attestations: read
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DEPLOY_BRANCH: main
      DEPLOY_REF: ${{ github.event.workflow_run.head_sha }}
      READINESS_RUN_ID: ${{ github.event.workflow_run.id }}
      READINESS_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      READINESS_WORKFLOW_NAME: Ordinary Account Cutover Readiness
      READINESS_WORKFLOW_PATH: .github/workflows/ordinary-account-cutover-readiness.yml

    steps:
      - name: Validate Readiness Workflow Run
        id: readiness-run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_run"
          [[ "$DEPLOY_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$READINESS_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$READINESS_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          run_json="$RUNNER_TEMP/readiness-workflow-run.json"
          workflow_json="$RUNNER_TEMP/readiness-workflow-definition.json"
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$READINESS_RUN_ID" \
            > "$run_json"
          workflow_id="$(node --input-type=module - "$run_json" <<'NODE'
          import { readFileSync } from "node:fs";

          const fail = (message) => {
            process.stderr.write(`${message}\n`);
            process.exit(1);
          };
          const run = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const expectedRunId = Number(process.env.READINESS_RUN_ID);
          const expectedRunAttempt = Number(process.env.READINESS_RUN_ATTEMPT);
          if (!Number.isSafeInteger(expectedRunId) || expectedRunId <= 0) fail("readiness_run_id_invalid");
          if (!Number.isSafeInteger(expectedRunAttempt) || expectedRunAttempt <= 0) fail("readiness_run_attempt_invalid");
          if (run.id !== expectedRunId) fail("readiness_run_id_mismatch");
          if (run.run_attempt !== expectedRunAttempt) fail("readiness_run_attempt_mismatch");
          if (run.status !== "completed" || run.conclusion !== "success") fail("readiness_run_not_successful");
          if (run.event !== "workflow_dispatch") fail("readiness_run_event_mismatch");
          if (run.name !== process.env.READINESS_WORKFLOW_NAME) fail("readiness_run_name_mismatch");
          if (run.path !== process.env.READINESS_WORKFLOW_PATH) fail("readiness_run_path_mismatch");
          if (run.head_branch !== "main") fail("readiness_run_branch_mismatch");
          if (run.head_sha !== process.env.DEPLOY_REF) fail("readiness_run_head_mismatch");
          if (run.repository?.full_name !== process.env.GITHUB_REPOSITORY) fail("readiness_run_repository_mismatch");
          if (run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY) fail("readiness_run_head_repository_mismatch");
          if (!Number.isSafeInteger(run.workflow_id) || run.workflow_id <= 0) fail("readiness_workflow_id_invalid");
          process.stdout.write(String(run.workflow_id));
          NODE
          )"
          [[ "$workflow_id" =~ ^[1-9][0-9]*$ ]]
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" \
            > "$workflow_json"
          node --input-type=module - "$workflow_json" "$workflow_id" <<'NODE'
          import { readFileSync } from "node:fs";

          const workflow = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const expectedId = Number(process.argv[3]);
          if (
            workflow.id !== expectedId ||
            workflow.name !== process.env.READINESS_WORKFLOW_NAME ||
            workflow.path !== process.env.READINESS_WORKFLOW_PATH ||
            workflow.state !== "active"
          ) {
            process.stderr.write("readiness_workflow_definition_mismatch\n");
            process.exit(1);
          }
          NODE
          rm -f -- "$run_json" "$workflow_json"
          {
            printf 'sha=%s\n' "$DEPLOY_REF"
            printf 'run_id=%s\n' "$READINESS_RUN_ID"
            printf 'run_attempt=%s\n' "$READINESS_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout Tested Commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.readiness-run.outputs.sha }}

      - name: Resolve Deploy Commit
        id: deploy-commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_REF" =~ ^[0-9a-f]{40}$ ]]
          resolved_sha="$(git rev-parse HEAD)"
          test "$resolved_sha" = "$DEPLOY_REF"
          main_sha="$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          test "$main_sha" = "$resolved_sha"
          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve Readiness Artifacts
        id: readiness-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_pages="$RUNNER_TEMP/readiness-artifact-pages.json"
          gh api --method GET --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$READINESS_RUN_ID/artifacts?per_page=100" \
            > "$artifact_pages"
          node --input-type=module - "$artifact_pages" <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const fail = (message) => {
            process.stderr.write(`${message}\n`);
            process.exit(1);
          };
          const pages = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (!Array.isArray(pages) || pages.length === 0) fail("readiness_artifact_pages_invalid");
          const artifacts = [];
          for (const page of pages) {
            if (!page || !Array.isArray(page.artifacts) || !Number.isSafeInteger(page.total_count)) {
              fail("readiness_artifact_page_invalid");
            }
            artifacts.push(...page.artifacts);
          }
          if (artifacts.length !== 2 || pages.some((page) => page.total_count !== artifacts.length)) {
            fail("readiness_artifact_inventory_invalid");
          }
          const expected = new Map([
            [`faolla-production-readiness-report-${process.env.READINESS_RUN_ID}-${process.env.READINESS_RUN_ATTEMPT}`, "report"],
            [`faolla-production-readiness-attestation-${process.env.READINESS_RUN_ID}-${process.env.READINESS_RUN_ATTEMPT}`, "attestation"],
          ]);
          const now = Date.now();
          const outputs = new Map();
          const ids = new Set();
          for (const artifact of artifacts) {
            const key = expected.get(artifact?.name);
            if (!key || outputs.has(`${key}_id`)) fail("readiness_artifact_name_invalid");
            if (!Number.isSafeInteger(artifact.id) || artifact.id <= 0 || ids.has(artifact.id)) {
              fail("readiness_artifact_id_invalid");
            }
            ids.add(artifact.id);
            if (!Number.isSafeInteger(artifact.size_in_bytes) || artifact.size_in_bytes <= 0 || artifact.size_in_bytes > 2 * 1024 * 1024) {
              fail("readiness_artifact_size_invalid");
            }
            if (artifact.expired !== false) fail("readiness_artifact_expired");
            const expiresAt = Date.parse(artifact.expires_at);
            if (!Number.isFinite(expiresAt) || expiresAt <= now) fail("readiness_artifact_expiry_invalid");
            if (!/^sha256:[0-9a-f]{64}$/.test(artifact.digest ?? "")) {
              fail("readiness_artifact_digest_invalid");
            }
            if (
              artifact.workflow_run?.id !== Number(process.env.READINESS_RUN_ID) ||
              artifact.workflow_run?.head_branch !== "main" ||
              artifact.workflow_run?.head_sha !== process.env.DEPLOY_REF
            ) {
              fail("readiness_artifact_run_mismatch");
            }
            outputs.set(`${key}_id`, String(artifact.id));
            outputs.set(`${key}_digest`, artifact.digest);
          }
          if (outputs.size !== 4) fail("readiness_artifact_inventory_incomplete");
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            [...outputs].map(([key, value]) => `${key}=${value}\n`).join(""),
          );
          NODE
          rm -f -- "$artifact_pages"

      - name: Verify Readiness Evidence
        id: readiness-evidence
        env:
          GH_TOKEN: ${{ github.token }}
          READINESS_REPORT_ARTIFACT_ID: ${{ steps.readiness-artifacts.outputs.report_id }}
          READINESS_REPORT_ARTIFACT_DIGEST: ${{ steps.readiness-artifacts.outputs.report_digest }}
          READINESS_ATTESTATION_ARTIFACT_ID: ${{ steps.readiness-artifacts.outputs.attestation_id }}
          READINESS_ATTESTATION_ARTIFACT_DIGEST: ${{ steps.readiness-artifacts.outputs.attestation_digest }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          evidence_root="$RUNNER_TEMP/faolla-production-readiness-evidence"
          mkdir "$evidence_root"
          report_archive="$evidence_root/readiness-report.zip"
          attestation_archive="$evidence_root/readiness-attestation.zip"
          report_file="$evidence_root/production-readiness-report.json"
          attestation_file="$evidence_root/production-readiness-attestation.json"
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$READINESS_REPORT_ARTIFACT_ID/zip" \
            > "$report_archive"
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$READINESS_ATTESTATION_ARTIFACT_ID/zip" \
            > "$attestation_archive"
          report_archive_sha="sha256:$(sha256sum "$report_archive" | awk '{ print $1 }')"
          attestation_archive_sha="sha256:$(sha256sum "$attestation_archive" | awk '{ print $1 }')"
          test "$report_archive_sha" = "$READINESS_REPORT_ARTIFACT_DIGEST"
          test "$attestation_archive_sha" = "$READINESS_ATTESTATION_ARTIFACT_DIGEST"
          extract_single_json() {
            python3 - "$1" "$2" "$3" <<'PY'
          import os
          import stat
          import sys
          import zipfile

          archive, expected_name, destination = sys.argv[1:]
          maximum_bytes = 1024 * 1024
          with zipfile.ZipFile(archive, "r") as bundle:
              entries = bundle.infolist()
              if len(entries) != 1:
                  raise SystemExit("readiness_archive_inventory_invalid")
              entry = entries[0]
              mode = (entry.external_attr >> 16) & 0xFFFF
              if (
                  entry.filename != expected_name
                  or entry.is_dir()
                  or entry.flag_bits & 0x1
                  or entry.file_size <= 0
                  or entry.file_size > maximum_bytes
                  or entry.compress_size <= 0
                  or entry.compress_size > 2 * maximum_bytes
                  or stat.S_ISLNK(mode)
                  or entry.compress_type not in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED)
              ):
                  raise SystemExit("readiness_archive_entry_invalid")
              payload = bundle.read(entry)
              if len(payload) != entry.file_size:
                  raise SystemExit("readiness_archive_size_mismatch")
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
          if hasattr(os, "O_NOFOLLOW"):
              flags |= os.O_NOFOLLOW
          descriptor = os.open(destination, flags, 0o600)
          try:
              with os.fdopen(descriptor, "wb") as output:
                  output.write(payload)
          except BaseException:
              try:
                  os.close(descriptor)
              except OSError:
                  pass
              raise
          PY
          }
          extract_single_json "$report_archive" "production-readiness-report.json" "$report_file"
          extract_single_json "$attestation_archive" "production-readiness-attestation.json" "$attestation_file"
          rm -f -- "$report_archive" "$attestation_archive"
          node --input-type=module - "$report_file" <<'NODE'
          import { readFileSync } from "node:fs";
          import { canonicalJsonBytes } from "./scripts/production-release-attestation.mjs";

          const raw = readFileSync(process.argv[2]);
          let parsed;
          try {
            parsed = JSON.parse(raw.toString("utf8"));
          } catch {
            process.exit(1);
          }
          if (!raw.equals(canonicalJsonBytes(parsed))) process.exit(1);
          NODE
          signer_workflow="github.com/$GITHUB_REPOSITORY/$READINESS_WORKFLOW_PATH"
          verify_provenance() {
            local subject_file="$1"
            local verification_file="$2"
            local subject_name="$3"
            local subject_sha
            subject_sha="$(sha256sum "$subject_file" | awk '{ print $1 }')"
            gh attestation verify "$subject_file" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer_workflow" \
              --source-digest "$DEPLOY_REF" \
              --source-ref "refs/heads/main" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --deny-self-hosted-runners \
              --limit 10 \
              --format json > "$verification_file"
            node --input-type=module - "$verification_file" "$subject_name" "$subject_sha" <<'NODE'
          import { readFileSync } from "node:fs";

          const results = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const expectedName = process.argv[3];
          const expectedSha = process.argv[4];
          if (!Array.isArray(results) || results.length !== 1) process.exit(1);
          const subjects = results[0]?.verificationResult?.statement?.subject;
          if (
            !Array.isArray(subjects) ||
            subjects.length !== 1 ||
            subjects[0]?.name !== expectedName ||
            subjects[0]?.digest?.sha256 !== expectedSha
          ) process.exit(1);
          NODE
          }
          verify_provenance \
            "$report_file" "$evidence_root/readiness-report-verification.json" \
            "production-readiness-report.json"
          verify_provenance \
            "$attestation_file" "$evidence_root/readiness-attestation-verification.json" \
            "production-readiness-attestation.json"
          rm -f -- \
            "$evidence_root/readiness-report-verification.json" \
            "$evidence_root/readiness-attestation-verification.json"
          summary_file="$evidence_root/production-readiness-attestation-summary.json"
          node scripts/production-release-attestation.mjs validate \
            --input "$attestation_file" \
            --kind readiness \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-target-sha "$DEPLOY_REF" \
            --expected-run-id "$READINESS_RUN_ID" \
            --expected-run-attempt "$READINESS_RUN_ATTEMPT" \
            --expected-readiness-run-id "$READINESS_RUN_ID" \
            --expected-artifact-id "$READINESS_REPORT_ARTIFACT_ID" \
            --expected-artifact-digest "$READINESS_REPORT_ARTIFACT_DIGEST" \
            --expected-readiness-artifact-id "$READINESS_REPORT_ARTIFACT_ID" \
            --expected-readiness-artifact-digest "$READINESS_REPORT_ARTIFACT_DIGEST" \
            --minimum-remaining-seconds 6100 \
            > "$summary_file"
          report_bytes="$(wc -c < "$report_file" | tr -d '[:space:]')"
          report_sha256="$(sha256sum "$report_file" | awk '{ print $1 }')"
          node --input-type=module - \
            "$attestation_file" "$summary_file" "$report_bytes" "$report_sha256" <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const attestation = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const summary = JSON.parse(readFileSync(process.argv[3], "utf8"));
          const reportBytes = process.argv[4];
          const reportSha256 = process.argv[5];
          if (
            attestation.readinessArtifact?.file?.name !== "production-readiness-report.json" ||
            attestation.readinessArtifact?.file?.sizeBytes !== reportBytes ||
            attestation.readinessArtifact?.file?.sha256 !== reportSha256
          ) process.exit(1);
          const expectedSummaryKeys = [
            "artifactDigest", "artifactId", "backupArtifactDigest", "backupArtifactId",
            "backupAttestationArtifactDigest", "backupAttestationArtifactId", "backupRunAttempt", "backupRunId",
            "baselineSha256", "canonicalSha256", "databaseIdentitySha256", "kind", "readinessArtifactDigest",
            "readinessArtifactId", "readinessRunId", "repository", "runAttempt", "runId", "targetSha",
            "valid", "validUntil",
          ].sort();
          const actualSummaryKeys = Object.keys(summary).sort();
          if (
            actualSummaryKeys.length !== expectedSummaryKeys.length ||
            actualSummaryKeys.some((key, index) => key !== expectedSummaryKeys[index]) ||
            summary.valid !== true ||
            summary.kind !== "faolla.production-readiness.v1" ||
            summary.repository !== process.env.GITHUB_REPOSITORY ||
            summary.targetSha !== process.env.DEPLOY_REF ||
            summary.runId !== process.env.READINESS_RUN_ID ||
            summary.runAttempt !== process.env.READINESS_RUN_ATTEMPT ||
            summary.readinessRunId !== process.env.READINESS_RUN_ID ||
            summary.artifactId !== process.env.READINESS_REPORT_ARTIFACT_ID ||
            summary.artifactDigest !== process.env.READINESS_REPORT_ARTIFACT_DIGEST ||
            summary.readinessArtifactId !== process.env.READINESS_REPORT_ARTIFACT_ID ||
            summary.readinessArtifactDigest !== process.env.READINESS_REPORT_ARTIFACT_DIGEST
          ) process.exit(1);
          const positiveDecimal = (value) => typeof value === "string" && /^[1-9][0-9]*$/.test(value);
          const sha256Digest = (value) => typeof value === "string" && /^sha256:[0-9a-f]{64}$/.test(value);
          if (
            !positiveDecimal(summary.backupRunId) ||
            !positiveDecimal(summary.backupRunAttempt) ||
            !positiveDecimal(summary.backupArtifactId) ||
            !sha256Digest(summary.backupArtifactDigest) ||
            !positiveDecimal(summary.backupAttestationArtifactId) ||
            !sha256Digest(summary.backupAttestationArtifactDigest) ||
            !/^[0-9a-f]{64}$/.test(summary.canonicalSha256)
          ) process.exit(1);
          const outputs = {
            attestation_file: process.argv[2],
            canonical_sha256: summary.canonicalSha256,
            backup_run_id: summary.backupRunId,
            backup_run_attempt: summary.backupRunAttempt,
            backup_artifact_id: summary.backupArtifactId,
            backup_artifact_digest: summary.backupArtifactDigest,
            backup_attestation_artifact_id: summary.backupAttestationArtifactId,
            backup_attestation_artifact_digest: summary.backupAttestationArtifactDigest,
            valid_until: summary.validUntil,
          };
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            Object.entries(outputs).map(([key, value]) => `${key}=${value}\n`).join(""),
          );
          NODE
          rm -f -- "$summary_file" "$report_file"

      - name: Revalidate Live Recursive Backup Evidence
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ steps.readiness-evidence.outputs.backup_run_id }}
          BACKUP_RUN_ATTEMPT: ${{ steps.readiness-evidence.outputs.backup_run_attempt }}
          BACKUP_PRIMARY_ARTIFACT_ID: ${{ steps.readiness-evidence.outputs.backup_artifact_id }}
          BACKUP_PRIMARY_ARTIFACT_DIGEST: ${{ steps.readiness-evidence.outputs.backup_artifact_digest }}
          BACKUP_ATTESTATION_ARTIFACT_ID: ${{ steps.readiness-evidence.outputs.backup_attestation_artifact_id }}
          BACKUP_ATTESTATION_ARTIFACT_DIGEST: ${{ steps.readiness-evidence.outputs.backup_attestation_artifact_digest }}
          READINESS_VALID_UNTIL: ${{ steps.readiness-evidence.outputs.valid_until }}
          BACKUP_WORKFLOW_NAME: Encrypted Database Backup
          BACKUP_WORKFLOW_PATH: .github/workflows/database-backup.yml
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BACKUP_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BACKUP_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$BACKUP_PRIMARY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BACKUP_ATTESTATION_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BACKUP_PRIMARY_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BACKUP_ATTESTATION_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$READINESS_VALID_UNTIL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$ ]]
          current_main="$(gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$current_main" = "$DEPLOY_REF"
          revalidation_root="$RUNNER_TEMP/faolla-deploy-backup-revalidation"
          details_dir="$revalidation_root/artifacts"
          mkdir "$revalidation_root" "$details_dir"
          run_json="$revalidation_root/backup-run.json"
          workflow_json="$revalidation_root/backup-workflow.json"
          artifact_pages="$revalidation_root/backup-artifact-pages.json"
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID" \
            > "$run_json"
          workflow_id="$(node --input-type=module - "$run_json" <<'NODE'
          import { readFileSync } from "node:fs";

          const run = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (!Number.isSafeInteger(run?.workflow_id) || run.workflow_id <= 0) {
            process.stderr.write("backup_revalidation_workflow_id_invalid\n");
            process.exit(1);
          }
          process.stdout.write(String(run.workflow_id));
          NODE
          )"
          [[ "$workflow_id" =~ ^[1-9][0-9]*$ ]]
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" \
            > "$workflow_json"
          gh api --method GET --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID/artifacts?per_page=100" \
            > "$artifact_pages"
          mapfile -t artifact_ids < <(node --input-type=module - "$artifact_pages" <<'NODE'
          import { readFileSync } from "node:fs";

          const pages = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (!Array.isArray(pages) || pages.length === 0) process.exit(1);
          const artifacts = pages.flatMap((page) => {
            if (!page || !Array.isArray(page.artifacts) || page.total_count !== 5) process.exit(1);
            return page.artifacts;
          });
          const ids = artifacts.map((artifact) => artifact?.id);
          if (
            artifacts.length !== 5 ||
            ids.some((id) => !Number.isSafeInteger(id) || id <= 0) ||
            new Set(ids).size !== 5
          ) process.exit(1);
          process.stdout.write(`${ids.sort((left, right) => left - right).join("\n")}\n`);
          NODE
          )
          test "${#artifact_ids[@]}" -eq 5
          for artifact_id in "${artifact_ids[@]}"; do
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
            gh api --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              > "$details_dir/$artifact_id.json"
          done
          node --input-type=module - \
            "$run_json" "$workflow_json" "$artifact_pages" "$details_dir" <<'NODE'
          import { readFileSync, readdirSync } from "node:fs";
          import { join } from "node:path";

          const fail = (code) => {
            process.stderr.write(`${code}\n`);
            process.exit(1);
          };
          const positiveInteger = (value, code) => {
            const parsed = Number(value);
            if (!/^[1-9][0-9]*$/.test(value ?? "") || !Number.isSafeInteger(parsed)) fail(code);
            return parsed;
          };
          const canonicalTimestamp = (value, code) => {
            if (typeof value !== "string") fail(code);
            const timestamp = Date.parse(value);
            if (!Number.isFinite(timestamp)) fail(code);
            return { milliseconds: timestamp, value: new Date(timestamp).toISOString() };
          };
          const expectedRunId = positiveInteger(process.env.BACKUP_RUN_ID, "backup_revalidation_run_id_invalid");
          const expectedRunAttempt = positiveInteger(process.env.BACKUP_RUN_ATTEMPT, "backup_revalidation_attempt_invalid");
          const expectedPrimaryId = positiveInteger(process.env.BACKUP_PRIMARY_ARTIFACT_ID, "backup_revalidation_primary_id_invalid");
          const expectedAttestationId = positiveInteger(process.env.BACKUP_ATTESTATION_ARTIFACT_ID, "backup_revalidation_attestation_id_invalid");
          if (
            !/^sha256:[0-9a-f]{64}$/.test(process.env.BACKUP_PRIMARY_ARTIFACT_DIGEST ?? "") ||
            !/^sha256:[0-9a-f]{64}$/.test(process.env.BACKUP_ATTESTATION_ARTIFACT_DIGEST ?? "")
          ) fail("backup_revalidation_expected_digest_invalid");
          const readinessValidUntil = canonicalTimestamp(
            process.env.READINESS_VALID_UNTIL,
            "backup_revalidation_readiness_ttl_invalid",
          );
          if (
            readinessValidUntil.value !== process.env.READINESS_VALID_UNTIL ||
            readinessValidUntil.milliseconds - Date.now() < 6_000_000
          ) fail("backup_revalidation_readiness_ttl_insufficient");
          const run = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const workflow = JSON.parse(readFileSync(process.argv[3], "utf8"));
          const pages = JSON.parse(readFileSync(process.argv[4], "utf8"));
          const detailsDirectory = process.argv[5];
          if (
            run?.id !== expectedRunId ||
            run.run_attempt !== expectedRunAttempt ||
            run.status !== "completed" ||
            run.conclusion !== "success" ||
            run.event !== "workflow_dispatch" ||
            run.name !== process.env.BACKUP_WORKFLOW_NAME ||
            run.path !== process.env.BACKUP_WORKFLOW_PATH ||
            run.head_branch !== "main" ||
            run.head_sha !== process.env.DEPLOY_REF ||
            run.repository?.full_name !== process.env.GITHUB_REPOSITORY ||
            run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY ||
            !Number.isSafeInteger(run.workflow_id) || run.workflow_id <= 0
          ) fail("backup_revalidation_run_contract_invalid");
          if (
            workflow?.id !== run.workflow_id ||
            workflow.name !== process.env.BACKUP_WORKFLOW_NAME ||
            workflow.path !== process.env.BACKUP_WORKFLOW_PATH ||
            workflow.state !== "active"
          ) fail("backup_revalidation_workflow_contract_invalid");
          if (!Array.isArray(pages) || pages.length === 0) fail("backup_revalidation_pages_invalid");
          const artifacts = pages.flatMap((page) => {
            if (!page || !Array.isArray(page.artifacts) || page.total_count !== 5) {
              fail("backup_revalidation_page_invalid");
            }
            return page.artifacts;
          });
          if (artifacts.length !== 5) fail("backup_revalidation_inventory_count_invalid");
          const suffix = `${process.env.BACKUP_RUN_ID}-${process.env.BACKUP_RUN_ATTEMPT}`;
          const expectedNames = new Map([
            [`faolla-encrypted-disaster-recovery-${suffix}`, "primary"],
            [`faolla-production-backup-attestation-${suffix}`, "attestation"],
            [`faolla-backup-verification-reports-${suffix}`, "verificationReports"],
            [`faolla-encrypted-backup-attestation-bundle-${suffix}`, "encryptedAttestationBundle"],
            [`faolla-production-backup-attestation-bundle-${suffix}`, "productionAttestationBundle"],
          ]);
          const expectedFiles = artifacts
            .map((artifact) => `${artifact?.id}.json`)
            .sort();
          const detailFiles = readdirSync(detailsDirectory).sort();
          if (
            detailFiles.length !== 5 ||
            detailFiles.some((file, index) => file !== expectedFiles[index])
          ) fail("backup_revalidation_direct_inventory_invalid");
          const now = Date.now();
          const ids = new Set();
          const roles = new Map();
          for (const artifact of artifacts) {
            const role = expectedNames.get(artifact?.name);
            if (!role || roles.has(role)) fail("backup_revalidation_name_invalid");
            if (
              !Number.isSafeInteger(artifact.id) || artifact.id <= 0 || ids.has(artifact.id) ||
              !Number.isSafeInteger(artifact.size_in_bytes) || artifact.size_in_bytes <= 0 ||
              artifact.expired !== false ||
              !/^sha256:[0-9a-f]{64}$/.test(artifact.digest ?? "") ||
              artifact.workflow_run?.id !== expectedRunId ||
              artifact.workflow_run?.head_branch !== "main" ||
              artifact.workflow_run?.head_sha !== process.env.DEPLOY_REF
            ) fail("backup_revalidation_entry_invalid");
            const createdAt = canonicalTimestamp(artifact.created_at, "backup_revalidation_created_at_invalid");
            const expiresAt = canonicalTimestamp(artifact.expires_at, "backup_revalidation_expires_at_invalid");
            if (
              createdAt.milliseconds > now + 300_000 ||
              createdAt.milliseconds >= expiresAt.milliseconds ||
              expiresAt.milliseconds < readinessValidUntil.milliseconds
            ) fail("backup_revalidation_artifact_ttl_invalid");
            const direct = JSON.parse(
              readFileSync(join(detailsDirectory, `${artifact.id}.json`), "utf8"),
            );
            const directCreatedAt = canonicalTimestamp(direct?.created_at, "backup_revalidation_direct_created_at_invalid");
            const directExpiresAt = canonicalTimestamp(direct?.expires_at, "backup_revalidation_direct_expires_at_invalid");
            if (
              direct?.id !== artifact.id ||
              direct.name !== artifact.name ||
              direct.digest !== artifact.digest ||
              direct.size_in_bytes !== artifact.size_in_bytes ||
              direct.expired !== false ||
              directCreatedAt.value !== createdAt.value ||
              directExpiresAt.value !== expiresAt.value ||
              directExpiresAt.milliseconds < readinessValidUntil.milliseconds ||
              direct.workflow_run?.id !== expectedRunId ||
              direct.workflow_run?.head_branch !== "main" ||
              direct.workflow_run?.head_sha !== process.env.DEPLOY_REF
            ) fail("backup_revalidation_direct_artifact_mismatch");
            ids.add(artifact.id);
            roles.set(role, artifact);
          }
          if (ids.size !== 5 || roles.size !== 5) fail("backup_revalidation_contract_invalid");
          const primary = roles.get("primary");
          const attestation = roles.get("attestation");
          if (
            primary.id !== expectedPrimaryId ||
            primary.digest !== process.env.BACKUP_PRIMARY_ARTIFACT_DIGEST ||
            attestation.id !== expectedAttestationId ||
            attestation.digest !== process.env.BACKUP_ATTESTATION_ARTIFACT_DIGEST ||
            attestation.size_in_bytes > 2 * 1024 * 1024
          ) fail("backup_revalidation_verified_binding_mismatch");
          NODE

      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          if ! [[ "${SSH_PORT:-22}" =~ ^[0-9]{1,5}$ ]] \
            || [ "${SSH_PORT:-22}" -lt 1 ] \
            || [ "${SSH_PORT:-22}" -gt 65535 ]; then
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1
          known_hosts_lookup="$SSH_HOST"
          if [ "${SSH_PORT:-22}" != "22" ]; then
            known_hosts_lookup="[$SSH_HOST]:${SSH_PORT}"
          fi
          ssh-keygen -F "$known_hosts_lookup" -f ~/.ssh/known_hosts >/dev/null 2>&1

      - name: Deploy To Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
          APP_NAME: ${{ secrets.APP_NAME }}
          APP_PORT: ${{ secrets.APP_PORT }}
          APP_BRANCH: ${{ env.DEPLOY_BRANCH }}
