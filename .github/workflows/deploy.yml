          [[ "$PRODUCTION_READINESS_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$PRODUCTION_READINESS_REPORT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PRODUCTION_READINESS_ATTESTATION_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PRODUCTION_BACKUP_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PRODUCTION_BACKUP_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$PRODUCTION_BACKUP_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PRODUCTION_BACKUP_ATTESTATION_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PRODUCTION_READINESS_REPORT_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PRODUCTION_READINESS_ATTESTATION_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PRODUCTION_BACKUP_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PRODUCTION_BACKUP_ATTESTATION_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [ "${MERCHANT_ENTERPRISE_AUTOMATION_WORKER_ENABLED:-false}" != "true" ]; then
            MERCHANT_ENTERPRISE_AUTOMATION_WORKER_ENABLED=false
          fi
          if [ "${MERCHANT_ENTERPRISE_INVITATION_DELIVERY_MODE:-legacy}" != "outbox" ]; then
            MERCHANT_ENTERPRISE_INVITATION_DELIVERY_MODE=legacy
          fi
          if [ "${MERCHANT_ENTERPRISE_INVITATION_WORKER_ENABLED:-false}" != "true" ]; then
            MERCHANT_ENTERPRISE_INVITATION_WORKER_ENABLED=false
          fi
          if [ "${ORDINARY_LEGACY_PERSONAL_RECOVERY_ENABLED:-false}" != "true" ]; then
            ORDINARY_LEGACY_PERSONAL_RECOVERY_ENABLED=false
          fi
          if ! [[ "${MERCHANT_ENTERPRISE_INVITATION_AUTH_LINK_TTL_SECONDS:-3600}" =~ ^[0-9]{2,5}$ ]]; then
            MERCHANT_ENTERPRISE_INVITATION_AUTH_LINK_TTL_SECONDS=3600
          fi
          if ! [[ "${MERCHANT_ENTERPRISE_INVITATION_ISSUANCE_LEASE_SECONDS:-3900}" =~ ^[0-9]{2,5}$ ]]; then
            MERCHANT_ENTERPRISE_INVITATION_ISSUANCE_LEASE_SECONDS=3900
          fi
          APP_NAME="${APP_NAME:-merchant-space}"
          APP_PORT="${APP_PORT:-3000}"
          export \
            APP_DIR APP_NAME APP_PORT APP_BRANCH EXPECTED_DEPLOY_SHA \
            PRODUCTION_READINESS_ATTESTATION_FILE \
            PRODUCTION_READINESS_ATTESTATION_SHA256 \
            PRODUCTION_READINESS_RUN_ID PRODUCTION_READINESS_RUN_ATTEMPT \
            PRODUCTION_READINESS_REPORT_ARTIFACT_ID \
            PRODUCTION_READINESS_REPORT_ARTIFACT_DIGEST \
            PRODUCTION_READINESS_ATTESTATION_ARTIFACT_ID \
            PRODUCTION_READINESS_ATTESTATION_ARTIFACT_DIGEST \
            PRODUCTION_BACKUP_RUN_ID PRODUCTION_BACKUP_RUN_ATTEMPT \
            PRODUCTION_BACKUP_ARTIFACT_ID \
            PRODUCTION_BACKUP_ARTIFACT_DIGEST \
            PRODUCTION_BACKUP_ATTESTATION_ARTIFACT_ID \
            PRODUCTION_BACKUP_ATTESTATION_ARTIFACT_DIGEST \
            SUPABASE_INTERNAL_URL_B64 NEXT_PUBLIC_SUPABASE_URL_B64 \
            NEXT_PUBLIC_SUPABASE_ANON_KEY_B64 SUPABASE_SERVICE_ROLE_KEY_B64 \
            GOOGLE_BUSINESS_PROFILE_CLIENT_ID_B64 \
            GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET_B64 \
            GOOGLE_BUSINESS_PROFILE_TOKEN_KEY_B64 \
            GOOGLE_BUSINESS_PROFILE_REDIRECT_URI_B64 \
            GOOGLE_BUSINESS_PROFILE_SYNC_INTERVAL_MS \
            MERCHANT_ENTERPRISE_AUTOMATION_WORKER_ENABLED \
            MERCHANT_ENTERPRISE_INVITATION_DELIVERY_MODE \
            MERCHANT_ENTERPRISE_INVITATION_WORKER_ENABLED \
            MERCHANT_ENTERPRISE_INVITATION_AUTH_LINK_TTL_SECONDS \
            MERCHANT_ENTERPRISE_INVITATION_ISSUANCE_LEASE_SECONDS \
            MERCHANT_ENTERPRISE_INVITATION_HMAC_KEYRING_JSON_B64 \
            MERCHANT_ENTERPRISE_INVITATION_HMAC_ACTIVE_KEY_ID_B64 \
            MERCHANT_ENTERPRISE_INVITATION_PUBLIC_ORIGIN_B64 \
            MERCHANT_ENTERPRISE_INVITATION_EMAIL_FROM_B64 \
            MERCHANT_ENTERPRISE_INVITATION_EMAIL_REPLY_TO_B64 \
            ORDINARY_LEGACY_PERSONAL_RECOVERY_ENABLED \
            ORDINARY_LEGACY_PERSONAL_RECOVERY_CASE_JSON_B64 \
            ORDINARY_LEGACY_PERSONAL_RECOVERY_HMAC_SECRET_B64 \
            RESEND_API_KEY_B64 WEB_PUSH_PUBLIC_KEY WEB_PUSH_PRIVATE_KEY \
            WEB_PUSH_SUBJECT SUPER_ADMIN_ACCOUNT SUPER_ADMIN_PASSWORD \
            SUPER_ADMIN_VERIFICATION_EMAIL SUPER_ADMIN_VERIFICATION_SECRET
          DEPLOY_PAYLOAD_B64="$(node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          import { canonicalJsonBytes } from "./scripts/production-release-attestation.mjs";

          const keys = [
            "APP_DIR", "APP_NAME", "APP_PORT", "APP_BRANCH",
            "EXPECTED_DEPLOY_SHA", "SUPABASE_INTERNAL_URL_B64",
            "NEXT_PUBLIC_SUPABASE_URL_B64", "NEXT_PUBLIC_SUPABASE_ANON_KEY_B64",
            "SUPABASE_SERVICE_ROLE_KEY_B64", "GOOGLE_BUSINESS_PROFILE_CLIENT_ID_B64",
            "GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET_B64",
            "GOOGLE_BUSINESS_PROFILE_TOKEN_KEY_B64",
            "GOOGLE_BUSINESS_PROFILE_REDIRECT_URI_B64",
            "GOOGLE_BUSINESS_PROFILE_SYNC_INTERVAL_MS",
            "MERCHANT_ENTERPRISE_AUTOMATION_WORKER_ENABLED",
            "MERCHANT_ENTERPRISE_INVITATION_DELIVERY_MODE",
            "MERCHANT_ENTERPRISE_INVITATION_WORKER_ENABLED",
            "MERCHANT_ENTERPRISE_INVITATION_AUTH_LINK_TTL_SECONDS",
            "MERCHANT_ENTERPRISE_INVITATION_ISSUANCE_LEASE_SECONDS",
            "MERCHANT_ENTERPRISE_INVITATION_HMAC_KEYRING_JSON_B64",
            "MERCHANT_ENTERPRISE_INVITATION_HMAC_ACTIVE_KEY_ID_B64",
            "MERCHANT_ENTERPRISE_INVITATION_PUBLIC_ORIGIN_B64",
            "MERCHANT_ENTERPRISE_INVITATION_EMAIL_FROM_B64",
            "MERCHANT_ENTERPRISE_INVITATION_EMAIL_REPLY_TO_B64",
            "ORDINARY_LEGACY_PERSONAL_RECOVERY_ENABLED",
            "ORDINARY_LEGACY_PERSONAL_RECOVERY_CASE_JSON_B64",
            "ORDINARY_LEGACY_PERSONAL_RECOVERY_HMAC_SECRET_B64",
            "RESEND_API_KEY_B64", "WEB_PUSH_PUBLIC_KEY", "WEB_PUSH_PRIVATE_KEY",
            "WEB_PUSH_SUBJECT", "SUPER_ADMIN_ACCOUNT", "SUPER_ADMIN_PASSWORD",
            "SUPER_ADMIN_VERIFICATION_EMAIL", "SUPER_ADMIN_VERIFICATION_SECRET",
          ];
          const values = Object.fromEntries(keys.map((key) => [key, process.env[key] ?? ""]));
          const required = (key, pattern) => {
            const value = process.env[key] ?? "";
            if (!pattern.test(value)) process.exit(1);
            return value;
          };
          const positiveDecimal = /^[1-9][0-9]*$/;
          const sha256Digest = /^sha256:[0-9a-f]{64}$/;
          const sha256 = /^[0-9a-f]{64}$/;
          const canonicalBytes = readFileSync(process.env.PRODUCTION_READINESS_ATTESTATION_FILE ?? "");
          if (canonicalBytes.length <= 0 || canonicalBytes.length > 1048576) process.exit(1);
          const canonicalSha256 = createHash("sha256").update(canonicalBytes).digest("hex");
          if (canonicalSha256 !== required("PRODUCTION_READINESS_ATTESTATION_SHA256", sha256)) process.exit(1);
          const releaseAttestation = {
            schemaVersion: 1,
            repository: required("GITHUB_REPOSITORY", /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/),
            targetSha: values.EXPECTED_DEPLOY_SHA,
            readinessRunId: required("PRODUCTION_READINESS_RUN_ID", positiveDecimal),
            readinessRunAttempt: required("PRODUCTION_READINESS_RUN_ATTEMPT", positiveDecimal),
            readinessReportArtifactId: required("PRODUCTION_READINESS_REPORT_ARTIFACT_ID", positiveDecimal),
            readinessReportArtifactDigest: required("PRODUCTION_READINESS_REPORT_ARTIFACT_DIGEST", sha256Digest),
            readinessAttestationArtifactId: required("PRODUCTION_READINESS_ATTESTATION_ARTIFACT_ID", positiveDecimal),
            readinessAttestationArtifactDigest: required("PRODUCTION_READINESS_ATTESTATION_ARTIFACT_DIGEST", sha256Digest),
            backupRunId: required("PRODUCTION_BACKUP_RUN_ID", positiveDecimal),
            backupRunAttempt: required("PRODUCTION_BACKUP_RUN_ATTEMPT", positiveDecimal),
            backupArtifactId: required("PRODUCTION_BACKUP_ARTIFACT_ID", positiveDecimal),
            backupArtifactDigest: required("PRODUCTION_BACKUP_ARTIFACT_DIGEST", sha256Digest),
            backupAttestationArtifactId: required("PRODUCTION_BACKUP_ATTESTATION_ARTIFACT_ID", positiveDecimal),
            backupAttestationArtifactDigest: required("PRODUCTION_BACKUP_ATTESTATION_ARTIFACT_DIGEST", sha256Digest),
            canonicalSha256,
            canonicalBytesBase64: canonicalBytes.toString("base64"),
          };
          process.stdout.write(canonicalJsonBytes({ schemaVersion: 1, values, releaseAttestation }).toString("base64"));
          NODE
          )"
          test -n "$DEPLOY_PAYLOAD_B64"
          rm -f -- "$PRODUCTION_READINESS_ATTESTATION_FILE"
          unset \
            APP_DIR APP_NAME APP_PORT APP_BRANCH EXPECTED_DEPLOY_SHA \
            PRODUCTION_READINESS_ATTESTATION_FILE \
            PRODUCTION_READINESS_ATTESTATION_SHA256 \
            PRODUCTION_READINESS_ATTESTATION_BYTES \
            PRODUCTION_READINESS_ATTESTATION_ACTUAL_SHA256 \
            PRODUCTION_READINESS_RUN_ID PRODUCTION_READINESS_RUN_ATTEMPT \
            PRODUCTION_READINESS_REPORT_ARTIFACT_ID \
            PRODUCTION_READINESS_REPORT_ARTIFACT_DIGEST \
            PRODUCTION_READINESS_ATTESTATION_ARTIFACT_ID \
            PRODUCTION_READINESS_ATTESTATION_ARTIFACT_DIGEST \
            PRODUCTION_BACKUP_RUN_ID PRODUCTION_BACKUP_RUN_ATTEMPT \
            PRODUCTION_BACKUP_ARTIFACT_ID \
            PRODUCTION_BACKUP_ARTIFACT_DIGEST \
            PRODUCTION_BACKUP_ATTESTATION_ARTIFACT_ID \
            PRODUCTION_BACKUP_ATTESTATION_ARTIFACT_DIGEST \
            SUPABASE_INTERNAL_URL SUPABASE_INTERNAL_URL_B64 \
            NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_URL_B64 \
            NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_SUPABASE_ANON_KEY_B64 \
            SUPABASE_SERVICE_ROLE_KEY SUPABASE_SERVICE_ROLE_KEY_B64 \
            GOOGLE_BUSINESS_PROFILE_CLIENT_ID GOOGLE_BUSINESS_PROFILE_CLIENT_ID_B64 \
            GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET_B64 \
            GOOGLE_BUSINESS_PROFILE_TOKEN_KEY GOOGLE_BUSINESS_PROFILE_TOKEN_KEY_B64 \
            GOOGLE_BUSINESS_PROFILE_REDIRECT_URI GOOGLE_BUSINESS_PROFILE_REDIRECT_URI_B64 \
            GOOGLE_BUSINESS_PROFILE_SYNC_INTERVAL_MS \
            MERCHANT_ENTERPRISE_AUTOMATION_WORKER_ENABLED \
            MERCHANT_ENTERPRISE_INVITATION_DELIVERY_MODE \
            MERCHANT_ENTERPRISE_INVITATION_WORKER_ENABLED \
            MERCHANT_ENTERPRISE_INVITATION_AUTH_LINK_TTL_SECONDS \
            MERCHANT_ENTERPRISE_INVITATION_ISSUANCE_LEASE_SECONDS \
            MERCHANT_ENTERPRISE_INVITATION_HMAC_KEYRING_JSON \
            MERCHANT_ENTERPRISE_INVITATION_HMAC_KEYRING_JSON_B64 \
            MERCHANT_ENTERPRISE_INVITATION_HMAC_ACTIVE_KEY_ID \
            MERCHANT_ENTERPRISE_INVITATION_HMAC_ACTIVE_KEY_ID_B64 \
            MERCHANT_ENTERPRISE_INVITATION_PUBLIC_ORIGIN \
            MERCHANT_ENTERPRISE_INVITATION_PUBLIC_ORIGIN_B64 \
            MERCHANT_ENTERPRISE_INVITATION_EMAIL_FROM \
            MERCHANT_ENTERPRISE_INVITATION_EMAIL_FROM_B64 \
            MERCHANT_ENTERPRISE_INVITATION_EMAIL_REPLY_TO \
            MERCHANT_ENTERPRISE_INVITATION_EMAIL_REPLY_TO_B64 \
            ORDINARY_LEGACY_PERSONAL_RECOVERY_ENABLED \
            ORDINARY_LEGACY_PERSONAL_RECOVERY_CASE_JSON \
            ORDINARY_LEGACY_PERSONAL_RECOVERY_CASE_JSON_B64 \
            ORDINARY_LEGACY_PERSONAL_RECOVERY_HMAC_SECRET \
            ORDINARY_LEGACY_PERSONAL_RECOVERY_HMAC_SECRET_B64 \
            RESEND_API_KEY RESEND_API_KEY_B64 \
            WEB_PUSH_PUBLIC_KEY WEB_PUSH_PRIVATE_KEY WEB_PUSH_SUBJECT \
            SUPER_ADMIN_ACCOUNT SUPER_ADMIN_PASSWORD \
            SUPER_ADMIN_VERIFICATION_EMAIL SUPER_ADMIN_VERIFICATION_SECRET
          DEPLOY_SCRIPT_BYTES="$(wc -c < scripts/deploy.production.sh | tr -d '[:space:]')"
          DEPLOY_SCRIPT_SHA256="$(sha256sum scripts/deploy.production.sh | awk '{ print $1 }')"
          [[ "$DEPLOY_SCRIPT_BYTES" =~ ^[1-9][0-9]*$ ]]
          [[ "$DEPLOY_SCRIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          DEPLOY_ENVELOPE_MAGIC="FAOLLA_DEPLOY_ENVELOPE_V2"
          REMOTE_DEPLOY_COMMAND='set -eu; umask 077; deploy_transport_dir="$(mktemp -d)"; trap "rm -rf -- \"$deploy_transport_dir\"" EXIT; IFS= read -r deploy_envelope_magic; test "$deploy_envelope_magic" = "FAOLLA_DEPLOY_ENVELOPE_V2"; IFS= read -r deploy_payload_b64; IFS= read -r expected_deploy_bytes; IFS= read -r expected_deploy_sha256; case "$expected_deploy_bytes" in ""|0|*[!0-9]*) exit 1;; esac; test "${#expected_deploy_sha256}" -eq 64; case "$expected_deploy_sha256" in *[!0-9a-f]*) exit 1;; esac; printf "%s" "$deploy_payload_b64" | base64 -d > "$deploy_transport_dir/payload.json"; chmod 600 "$deploy_transport_dir/payload.json"; cat > "$deploy_transport_dir/deploy.sh"; actual_deploy_bytes="$(wc -c < "$deploy_transport_dir/deploy.sh" | tr -d "[:space:]")"; actual_deploy_sha256="$(sha256sum "$deploy_transport_dir/deploy.sh")"; actual_deploy_sha256="${actual_deploy_sha256%% *}"; test "$actual_deploy_bytes" = "$expected_deploy_bytes"; test "$actual_deploy_sha256" = "$expected_deploy_sha256"; chmod 700 "$deploy_transport_dir/deploy.sh"; FAOLLA_DEPLOY_PAYLOAD_FILE="$deploy_transport_dir/payload.json" bash "$deploy_transport_dir/deploy.sh"'
          DEPLOY_CAPTURE_MAX_BYTES=1048576
          test -n "${RUNNER_TEMP:-}"
          deploy_capture_dir="$(mktemp -d "${RUNNER_TEMP%/}/deploy-output.XXXXXX")"
          deploy_stdout_file="$deploy_capture_dir/stdout.log"
          deploy_stderr_file="$deploy_capture_dir/stderr.log"
          deploy_stdout_fifo="$deploy_capture_dir/stdout.fifo"
          deploy_stderr_fifo="$deploy_capture_dir/stderr.fifo"
          deploy_stdout_capture_pid=""
          deploy_stderr_capture_pid=""
          cleanup_deploy_capture() {
            local deploy_capture_pid
            local saved_stdout_capture_pid="$deploy_stdout_capture_pid"
            local saved_stderr_capture_pid="$deploy_stderr_capture_pid"
            deploy_stdout_capture_pid=""
            deploy_stderr_capture_pid=""
            set +e
            for deploy_capture_pid in \
              "$saved_stdout_capture_pid" \
              "$saved_stderr_capture_pid"; do
              if [[ "$deploy_capture_pid" =~ ^[1-9][0-9]*$ ]] \
                && kill -0 "$deploy_capture_pid" >/dev/null 2>&1; then
                kill "$deploy_capture_pid" >/dev/null 2>&1
                wait "$deploy_capture_pid" >/dev/null 2>&1
              fi
            done
            rm -f -- \
              "$deploy_stdout_file" \
              "$deploy_stderr_file" \
              "$deploy_stdout_fifo" \
              "$deploy_stderr_fifo"
            rmdir -- "$deploy_capture_dir" >/dev/null 2>&1 || true
          }
          handle_deploy_capture_signal() {
            local deploy_signal_status="$1"
            trap - EXIT HUP INT TERM
            cleanup_deploy_capture
            exit "$deploy_signal_status"
          }
          emit_safe_deploy_diagnostics() {
            local deploy_diagnostic_code
            for deploy_diagnostic_code in \
              '[deploy] deploy_failed_readiness_fence_nonretryable' \
              '[deploy] deploy_forward_booking_persistence_hard_failed' \
              '[deploy] deploy_forward_booking_persistence_integrity_failed' \
              '[deploy] deploy_forward_booking_persistence_invocation_failed' \
              '[deploy] deploy_forward_booking_persistence_state_failed' \
              '[deploy] deploy_forward_booking_persistence_transient_exhausted' \
              '[deploy] deploy_forward_booking_persistence_transient_retry' \
              '[deploy] deploy_preflight_booking_persistence_hard_failed' \
              '[deploy] deploy_preflight_booking_persistence_integrity_failed' \
              '[deploy] deploy_preflight_booking_persistence_invocation_failed' \
              '[deploy] deploy_preflight_booking_persistence_transient_failed' \
              '[deploy] deploy_rollback_failed_compatibility_restore' \
              '[deploy] deploy_rollback_failed_current_restore' \
              '[deploy] deploy_rollback_failed_evidence' \
              '[deploy] deploy_rollback_failed_fence_checkpoint' \
              '[deploy] deploy_rollback_failed_fence_cleanup' \
              '[deploy] deploy_rollback_failed_fence_reacquire' \
              '[deploy] deploy_rollback_failed_fence_release' \
              '[deploy] deploy_rollback_failed_pm2_save' \
              '[deploy] deploy_rollback_failed_port_quiesce' \
              '[deploy] deploy_rollback_failed_previous_web_health' \
              '[deploy] deploy_rollback_failed_previous_web_start' \
              '[deploy] deploy_rollback_failed_release_cleanup' \
              '[deploy] deploy_rollback_failed_runtime_restore' \
              '[deploy] deploy_rollback_failed_unknown' \
              '[deploy] deploy_rollback_failed_web_quiesce' \
              '[deploy] deploy_rollback_failed_worker_quiesce' \
              '[deploy] deploy_rollback_failed_worker_restart' \
              '[deploy] deploy_stage_candidate_health_failed' \
              '[deploy] deploy_stage_candidate_start_failed' \
              '[deploy] deploy_stage_candidate_verification_failed' \
              '[deploy] deploy_stage_forward_switch_failed' \
              '[deploy] deploy_stage_post_commit_finalize_failed' \
              '[deploy] deploy_stage_pre_forward_restore_failed' \
              '[deploy] deploy_stage_previous_web_quiesce_failed' \
              '[deploy] deploy_stage_previous_worker_quiesce_failed' \
              '[deploy] deploy_stage_protected_preflight_failed' \
              '[deploy] deploy_stage_release_build_failed' \
              '[deploy] deploy_stage_release_finalize_failed' \
              '[deploy] readiness_fence_waiter_cancelled_retry' \
              '[deploy] readiness_fence_waiter_retry_exhausted'; do
              if grep -aFqx -- "$deploy_diagnostic_code" \
                "$deploy_stdout_file" "$deploy_stderr_file" >/dev/null 2>&1; then
                printf '%s\n' "$deploy_diagnostic_code"
              fi
            done
          }
          trap cleanup_deploy_capture EXIT
          trap 'handle_deploy_capture_signal 129' HUP
          trap 'handle_deploy_capture_signal 130' INT
          trap 'handle_deploy_capture_signal 143' TERM
          chmod 700 "$deploy_capture_dir"
          umask 077
          : > "$deploy_stdout_file"
          : > "$deploy_stderr_file"
          mkfifo "$deploy_stdout_fifo" "$deploy_stderr_fifo"
          chmod 600 \
            "$deploy_stdout_file" \
            "$deploy_stderr_file" \
            "$deploy_stdout_fifo" \
            "$deploy_stderr_fifo"
          set +e
          tail -c "$DEPLOY_CAPTURE_MAX_BYTES" \
            < "$deploy_stdout_fifo" > "$deploy_stdout_file" 2>/dev/null &
          deploy_stdout_capture_pid=$!
          tail -c "$DEPLOY_CAPTURE_MAX_BYTES" \
            < "$deploy_stderr_fifo" > "$deploy_stderr_file" 2>/dev/null &
          deploy_stderr_capture_pid=$!
          (
            set -e
            printf '%s\n' "$DEPLOY_ENVELOPE_MAGIC"
            printf '%s\n' "$DEPLOY_PAYLOAD_B64"
            printf '%s\n' "$DEPLOY_SCRIPT_BYTES"
            printf '%s\n' "$DEPLOY_SCRIPT_SHA256"
            cat scripts/deploy.production.sh
          ) 2>/dev/null | ssh -T -o ConnectTimeout=20 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "$REMOTE_DEPLOY_COMMAND" \
            > "$deploy_stdout_fifo" 2> "$deploy_stderr_fifo"
          transport_status=("${PIPESTATUS[@]}")
          frame_status="${transport_status[0]:-1}"
          ssh_status="${transport_status[1]:-1}"
          wait "$deploy_stdout_capture_pid"
          stdout_capture_status=$?
          deploy_stdout_capture_pid=""
          wait "$deploy_stderr_capture_pid"
          stderr_capture_status=$?
          deploy_stderr_capture_pid=""
          set -e
          if [ "$ssh_status" != "0" ] || [ "$frame_status" != "0" ]; then
            emit_safe_deploy_diagnostics
          fi
          if [ "$stdout_capture_status" != "0" ] \
            || [ "$stderr_capture_status" != "0" ]; then
            echo "[deploy] deploy_output_capture_failed"
            if [ "$ssh_status" != "0" ]; then
              echo "[deploy] deploy_transport_or_remote_execution_failed"
              exit "$ssh_status"
            fi
            if [ "$frame_status" != "0" ]; then
              echo "[deploy] deploy_transport_or_remote_execution_failed"
              exit "$frame_status"
            fi
            exit 1
          fi
          if [ "$ssh_status" != "0" ]; then
            echo "[deploy] deploy_transport_or_remote_execution_failed"
            exit "$ssh_status"
          fi
          if [ "$frame_status" != "0" ]; then
            echo "[deploy] deploy_transport_or_remote_execution_failed"
            exit "$frame_status"
          fi

      - name: Verify Public Release
        env:
          EXPECTED_BUILD: ${{ steps.deploy-commit.outputs.sha }}
        run: |
          node scripts/check-production-smoke.mjs \
            --origin https://faolla.com \
            --paths /,/login,/10909094,/admin \
            --expected-build "$EXPECTED_BUILD" \
            --attempts 8 \
            --delay-ms 2000 \
            --timeout-ms 12000
