name: Deploy Production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_branch }}
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout Tested Commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Resolve Deploy Commit
        id: deploy-commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          scan_ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if ssh-keyscan -T 15 -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts; then
              scan_ok=1
              break
            fi
            if [ "$attempt" != "8" ]; then
              sleep 10
            fi
          done
          if [ "$scan_ok" != "1" ]; then
            echo "::warning::ssh-keyscan could not reach the deployment host; the deploy step will still attempt SSH with StrictHostKeyChecking=accept-new."
          fi

      - name: Deploy To Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
          APP_NAME: ${{ secrets.APP_NAME }}
          APP_PORT: ${{ secrets.APP_PORT }}
          APP_BRANCH: ${{ env.DEPLOY_BRANCH }}
          SUPABASE_INTERNAL_URL: ${{ vars.SUPABASE_INTERNAL_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_BUSINESS_PROFILE_CLIENT_ID: ${{ secrets.GOOGLE_BUSINESS_PROFILE_CLIENT_ID }}
          GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET: ${{ secrets.GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET }}
          GOOGLE_BUSINESS_PROFILE_TOKEN_KEY: ${{ secrets.GOOGLE_BUSINESS_PROFILE_TOKEN_KEY }}
          GOOGLE_BUSINESS_PROFILE_REDIRECT_URI: ${{ secrets.GOOGLE_BUSINESS_PROFILE_REDIRECT_URI }}
          GOOGLE_BUSINESS_PROFILE_SYNC_INTERVAL_MS: ${{ secrets.GOOGLE_BUSINESS_PROFILE_SYNC_INTERVAL_MS }}
          MERCHANT_ENTERPRISE_AUTOMATION_WORKER_ENABLED: ${{ vars.MERCHANT_ENTERPRISE_AUTOMATION_WORKER_ENABLED }}
          MERCHANT_ENTERPRISE_INVITATION_DELIVERY_MODE: ${{ vars.MERCHANT_ENTERPRISE_INVITATION_DELIVERY_MODE }}
          MERCHANT_ENTERPRISE_INVITATION_WORKER_ENABLED: ${{ vars.MERCHANT_ENTERPRISE_INVITATION_WORKER_ENABLED }}
          MERCHANT_ENTERPRISE_INVITATION_HMAC_KEYRING_JSON: ${{ secrets.MERCHANT_ENTERPRISE_INVITATION_HMAC_KEYRING_JSON }}
          MERCHANT_ENTERPRISE_INVITATION_HMAC_ACTIVE_KEY_ID: ${{ secrets.MERCHANT_ENTERPRISE_INVITATION_HMAC_ACTIVE_KEY_ID }}
          MERCHANT_ENTERPRISE_INVITATION_PUBLIC_ORIGIN: ${{ vars.MERCHANT_ENTERPRISE_INVITATION_PUBLIC_ORIGIN }}
          MERCHANT_ENTERPRISE_INVITATION_EMAIL_FROM: ${{ secrets.MERCHANT_ENTERPRISE_INVITATION_EMAIL_FROM }}
          MERCHANT_ENTERPRISE_INVITATION_EMAIL_REPLY_TO: ${{ secrets.MERCHANT_ENTERPRISE_INVITATION_EMAIL_REPLY_TO }}
          MERCHANT_ENTERPRISE_INVITATION_AUTH_LINK_TTL_SECONDS: ${{ vars.MERCHANT_ENTERPRISE_INVITATION_AUTH_LINK_TTL_SECONDS }}
          MERCHANT_ENTERPRISE_INVITATION_ISSUANCE_LEASE_SECONDS: ${{ vars.MERCHANT_ENTERPRISE_INVITATION_ISSUANCE_LEASE_SECONDS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WEB_PUSH_PUBLIC_KEY: ${{ secrets.WEB_PUSH_PUBLIC_KEY }}
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
          WEB_PUSH_SUBJECT: ${{ secrets.WEB_PUSH_SUBJECT }}
          SUPER_ADMIN_ACCOUNT: ${{ secrets.SUPER_ADMIN_ACCOUNT }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          SUPER_ADMIN_VERIFICATION_EMAIL: ${{ secrets.SUPER_ADMIN_VERIFICATION_EMAIL }}
          SUPER_ADMIN_VERIFICATION_SECRET: ${{ secrets.SUPER_ADMIN_VERIFICATION_SECRET }}
        run: |
          test -n "$SSH_USER"
          test -n "$APP_DIR"
          SUPABASE_INTERNAL_URL_B64="$(printf '%s' "${SUPABASE_INTERNAL_URL:-}" | base64 -w0)"
          NEXT_PUBLIC_SUPABASE_URL_B64="$(printf '%s' "${NEXT_PUBLIC_SUPABASE_URL:-}" | base64 -w0)"
          NEXT_PUBLIC_SUPABASE_ANON_KEY_B64="$(printf '%s' "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" | base64 -w0)"
          SUPABASE_SERVICE_ROLE_KEY_B64="$(printf '%s' "${SUPABASE_SERVICE_ROLE_KEY:-}" | base64 -w0)"
          GOOGLE_BUSINESS_PROFILE_CLIENT_ID_B64="$(printf '%s' "${GOOGLE_BUSINESS_PROFILE_CLIENT_ID:-}" | base64 -w0)"
          GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET_B64="$(printf '%s' "${GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET:-}" | base64 -w0)"
          GOOGLE_BUSINESS_PROFILE_TOKEN_KEY_B64="$(printf '%s' "${GOOGLE_BUSINESS_PROFILE_TOKEN_KEY:-}" | base64 -w0)"
          GOOGLE_BUSINESS_PROFILE_REDIRECT_URI_B64="$(printf '%s' "${GOOGLE_BUSINESS_PROFILE_REDIRECT_URI:-}" | base64 -w0)"
          MERCHANT_ENTERPRISE_INVITATION_HMAC_KEYRING_JSON_B64="$(printf '%s' "${MERCHANT_ENTERPRISE_INVITATION_HMAC_KEYRING_JSON:-}" | base64 -w0)"
          MERCHANT_ENTERPRISE_INVITATION_HMAC_ACTIVE_KEY_ID_B64="$(printf '%s' "${MERCHANT_ENTERPRISE_INVITATION_HMAC_ACTIVE_KEY_ID:-}" | base64 -w0)"
          MERCHANT_ENTERPRISE_INVITATION_PUBLIC_ORIGIN_B64="$(printf '%s' "${MERCHANT_ENTERPRISE_INVITATION_PUBLIC_ORIGIN:-}" | base64 -w0)"
          MERCHANT_ENTERPRISE_INVITATION_EMAIL_FROM_B64="$(printf '%s' "${MERCHANT_ENTERPRISE_INVITATION_EMAIL_FROM:-}" | base64 -w0)"
          MERCHANT_ENTERPRISE_INVITATION_EMAIL_REPLY_TO_B64="$(printf '%s' "${MERCHANT_ENTERPRISE_INVITATION_EMAIL_REPLY_TO:-}" | base64 -w0)"
          RESEND_API_KEY_B64="$(printf '%s' "${RESEND_API_KEY:-}" | base64 -w0)"
          if [ "${MERCHANT_ENTERPRISE_AUTOMATION_WORKER_ENABLED:-false}" != "true" ]; then
            MERCHANT_ENTERPRISE_AUTOMATION_WORKER_ENABLED=false
          fi
          if [ "${MERCHANT_ENTERPRISE_INVITATION_DELIVERY_MODE:-legacy}" != "outbox" ]; then
            MERCHANT_ENTERPRISE_INVITATION_DELIVERY_MODE=legacy
          fi
          if [ "${MERCHANT_ENTERPRISE_INVITATION_WORKER_ENABLED:-false}" != "true" ]; then
            MERCHANT_ENTERPRISE_INVITATION_WORKER_ENABLED=false
          fi
          if ! [[ "${MERCHANT_ENTERPRISE_INVITATION_AUTH_LINK_TTL_SECONDS:-3600}" =~ ^[0-9]{2,5}$ ]]; then
            MERCHANT_ENTERPRISE_INVITATION_AUTH_LINK_TTL_SECONDS=3600
          fi
          if ! [[ "${MERCHANT_ENTERPRISE_INVITATION_ISSUANCE_LEASE_SECONDS:-3900}" =~ ^[0-9]{2,5}$ ]]; then
            MERCHANT_ENTERPRISE_INVITATION_ISSUANCE_LEASE_SECONDS=3900
          fi
          for attempt in 1 2 3 4 5; do
            set +e
            ssh -o ConnectTimeout=20 -o ConnectionAttempts=3 -o StrictHostKeyChecking=accept-new -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
              "APP_DIR='$APP_DIR' APP_NAME='${APP_NAME:-merchant-space}' APP_PORT='${APP_PORT:-3000}' APP_BRANCH='$APP_BRANCH' SUPABASE_INTERNAL_URL_B64='$SUPABASE_INTERNAL_URL_B64' NEXT_PUBLIC_SUPABASE_URL_B64='$NEXT_PUBLIC_SUPABASE_URL_B64' NEXT_PUBLIC_SUPABASE_ANON_KEY_B64='$NEXT_PUBLIC_SUPABASE_ANON_KEY_B64' SUPABASE_SERVICE_ROLE_KEY_B64='$SUPABASE_SERVICE_ROLE_KEY_B64' GOOGLE_BUSINESS_PROFILE_CLIENT_ID_B64='$GOOGLE_BUSINESS_PROFILE_CLIENT_ID_B64' GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET_B64='$GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET_B64' GOOGLE_BUSINESS_PROFILE_TOKEN_KEY_B64='$GOOGLE_BUSINESS_PROFILE_TOKEN_KEY_B64' GOOGLE_BUSINESS_PROFILE_REDIRECT_URI_B64='$GOOGLE_BUSINESS_PROFILE_REDIRECT_URI_B64' GOOGLE_BUSINESS_PROFILE_SYNC_INTERVAL_MS='${GOOGLE_BUSINESS_PROFILE_SYNC_INTERVAL_MS:-}' MERCHANT_ENTERPRISE_AUTOMATION_WORKER_ENABLED='$MERCHANT_ENTERPRISE_AUTOMATION_WORKER_ENABLED' MERCHANT_ENTERPRISE_INVITATION_DELIVERY_MODE='$MERCHANT_ENTERPRISE_INVITATION_DELIVERY_MODE' MERCHANT_ENTERPRISE_INVITATION_WORKER_ENABLED='$MERCHANT_ENTERPRISE_INVITATION_WORKER_ENABLED' MERCHANT_ENTERPRISE_INVITATION_AUTH_LINK_TTL_SECONDS='$MERCHANT_ENTERPRISE_INVITATION_AUTH_LINK_TTL_SECONDS' MERCHANT_ENTERPRISE_INVITATION_ISSUANCE_LEASE_SECONDS='$MERCHANT_ENTERPRISE_INVITATION_ISSUANCE_LEASE_SECONDS' MERCHANT_ENTERPRISE_INVITATION_HMAC_KEYRING_JSON_B64='$MERCHANT_ENTERPRISE_INVITATION_HMAC_KEYRING_JSON_B64' MERCHANT_ENTERPRISE_INVITATION_HMAC_ACTIVE_KEY_ID_B64='$MERCHANT_ENTERPRISE_INVITATION_HMAC_ACTIVE_KEY_ID_B64' MERCHANT_ENTERPRISE_INVITATION_PUBLIC_ORIGIN_B64='$MERCHANT_ENTERPRISE_INVITATION_PUBLIC_ORIGIN_B64' MERCHANT_ENTERPRISE_INVITATION_EMAIL_FROM_B64='$MERCHANT_ENTERPRISE_INVITATION_EMAIL_FROM_B64' MERCHANT_ENTERPRISE_INVITATION_EMAIL_REPLY_TO_B64='$MERCHANT_ENTERPRISE_INVITATION_EMAIL_REPLY_TO_B64' RESEND_API_KEY_B64='$RESEND_API_KEY_B64' WEB_PUSH_PUBLIC_KEY='${WEB_PUSH_PUBLIC_KEY:-}' WEB_PUSH_PRIVATE_KEY='${WEB_PUSH_PRIVATE_KEY:-}' WEB_PUSH_SUBJECT='${WEB_PUSH_SUBJECT:-}' SUPER_ADMIN_ACCOUNT='${SUPER_ADMIN_ACCOUNT:-}' SUPER_ADMIN_PASSWORD='${SUPER_ADMIN_PASSWORD:-}' SUPER_ADMIN_VERIFICATION_EMAIL='${SUPER_ADMIN_VERIFICATION_EMAIL:-}' SUPER_ADMIN_VERIFICATION_SECRET='${SUPER_ADMIN_VERIFICATION_SECRET:-}' bash -s" \
              < scripts/deploy.production.sh
            ssh_status=$?
            set -e
            if [ "$ssh_status" = "0" ]; then
              break
            fi
            if [ "$ssh_status" != "255" ]; then
              exit "$ssh_status"
            fi
            if [ "$attempt" = "5" ]; then
              exit "$ssh_status"
            fi
            sleep 10
          done

      - name: Verify Public Release
        env:
          EXPECTED_BUILD: ${{ steps.deploy-commit.outputs.sha }}
        run: |
          node scripts/check-production-smoke.mjs \
            --origin https://faolla.com \
            --paths /,/login,/10909094,/admin \
            --expected-build "$EXPECTED_BUILD" \
            --attempts 8 \
            --delay-ms 2000 \
            --timeout-ms 12000
